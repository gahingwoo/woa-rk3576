name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a runner-image refresh cannot silently change the headers the
  # drivers are validated against. Both the SDK and the WDK must be this
  # version; the km class extensions (sdport, SpbCx, GpioClx, NetAdapterCx)
  # come from the WDK half.
  WDK_VERSION: '10.0.26100.0'

jobs:
  checks:
    name: Structure & docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Driver package structure
        run: bash .github/scripts/check-structure.sh
      - name: Markdown relative links
        run: bash .github/scripts/check-links.sh

  build:
    name: WDK build (${{ matrix.name }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gpio, proj: drivers/gpio/rk3576gpio/rk3576gpio.vcxproj }
          - { name: i2c,  proj: drivers/i2c/rk3xi2c/rk3xi2c.vcxproj }
          - { name: spi,  proj: drivers/spi/rk3xspi/rk3xspi.vcxproj }
          - { name: sd,   proj: drivers/storage/rkdwmmc/rkdwmmc.vcxproj }
          - { name: gmac, proj: drivers/net/dwmac/dwmac.vcxproj }
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Toolchain inventory
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $ver = '${{ env.WDK_VERSION }}'
          Write-Host "--- Include ---"
          Get-ChildItem "$kits\Include" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- Lib ---"
          Get-ChildItem "$kits\Lib" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- where the headers we depend on actually live ---"
          # The class extensions do not all ship in Include\<ver>\km: SpbCx and
          # NetAdapterCx live in versioned class-extension trees that the WDK
          # targets add only when the project opts in. Locate them, do not guess.
          foreach ($h in 'sdport.h','spbcx.h','gpioclx.h','netadaptercx.h','acpiioct.h') {
            Get-ChildItem $kits -Recurse -Filter $h -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("{0,-18} {1}" -f $h, $_.FullName) }
          }
          Write-Host "--- class-extension import libs (arm64) ---"
          foreach ($l in 'SpbCxStubs.lib','msgpioclxstub.lib','netadaptercxstub.lib','sdport.lib') {
            Get-ChildItem $kits -Recurse -Filter $l -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'arm64' } |
              ForEach-Object { Write-Host ("{0,-22} {1}" -f $l, $_.FullName) }
          }
          Write-Host "--- WDK VS build targets ---"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS: $vs"
          Get-ChildItem "$vs\MSBuild\Microsoft\VC\v170\Platforms\ARM64\PlatformToolsets" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- armasm64 ---"
          Get-ChildItem "$vs\VC\Tools\MSVC" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem "$($_.FullName)\bin\Hostx64\arm64\armasm64.exe" -ErrorAction SilentlyContinue } |
            Select-Object -ExpandProperty FullName
          Write-Host "--- inf2cat supported /os values ---"
          # The WDK default for a Universal Windows10 ARM64 driver is
          # Server10_arm64, i.e. build 14393 -- older than the 16299 our INFs
          # require for DIRID 13, so the DDInstall sections are excluded and the
          # signability test fails. Print what this inf2cat actually accepts.
          & "$kits\bin\$ver\x86\inf2cat.exe" /? 2>&1 | Select-String -Pattern 'ARM64|arm64'
          Write-Host "--- masm/marmasm build customizations ---"
          Get-ChildItem "$vs\MSBuild\Microsoft\VC\v170\BuildCustomizations" -Filter '*asm*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      - name: Resolve the WDK version
        id: wdk
        shell: pwsh
        run: |
          # A missing toolchain is a build failure, not something to skip past.
          # If the pin is absent, the runner image changed and WDK_VERSION
          # needs a deliberate bump - do not paper over it.
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $ver = '${{ env.WDK_VERSION }}'
          if ($ver -eq '') {
            $ver = (Get-ChildItem "$kits\Include" |
                    Where-Object { Test-Path (Join-Path $_.FullName 'km\sdport.h') } |
                    Sort-Object Name -Descending |
                    Select-Object -First 1).Name
            Write-Host "::warning::WDK_VERSION unpinned; auto-selected $ver"
          }
          if (-not $ver) { throw "no WDK with km headers found on this runner" }
          # Paths settled by the inventory step, not assumed: the class
          # extensions live in versioned subtrees and acpiioct.h is in shared,
          # not km.
          $need = @(
            "$kits\Include\$ver\km\wdm.h",
            "$kits\Include\$ver\km\sdport.h",
            "$kits\Include\$ver\km\gpioclx.h",
            "$kits\Include\$ver\shared\acpiioct.h",
            "$kits\Include\$ver\km\spb\1.1\spbcx.h",
            "$kits\Include\$ver\km\netcx\kmdf\adapter\2.1\netadaptercx.h",
            "$kits\Lib\$ver\km\arm64\ntoskrnl.lib",
            "$kits\Lib\$ver\km\arm64\sdport.lib",
            "$kits\Lib\$ver\km\arm64\msgpioclxstub.lib",
            "$kits\Lib\$ver\km\arm64\spb\1.1\spbcxstubs.lib",
            "$kits\Lib\$ver\km\arm64\netcx\kmdf\adapter\2.1\netadaptercxstub.lib"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::missing $_" }
            throw "WDK $ver is not fully present on this runner"
          }
          Write-Host "Using WDK $ver."
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.name }} (ARM64)
        shell: pwsh
        run: |
          msbuild ${{ matrix.proj }} `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:WindowsTargetPlatformVersion=${{ steps.wdk.outputs.version }} `
            /p:SignMode=Off `
            /m /nologo /v:normal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for ${{ matrix.name }}" }

      - name: Upload driver package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rk3576-woa-${{ matrix.name }}-arm64
          path: |
            **/ARM64/Release/**/*.sys
            **/ARM64/Release/**/*.inf
            **/ARM64/Release/**/*.cat
            **/ARM64/Release/**/*.pdb
          if-no-files-found: warn

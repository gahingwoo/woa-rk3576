name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a runner-image refresh cannot silently change the headers the
  # drivers are validated against. Both the SDK and the WDK must be this
  # version; the km class extensions (sdport, SpbCx, GpioClx, NetAdapterCx)
  # come from the WDK half.
  WDK_VERSION: '10.0.26100.0'
  # The RK3576 tools bundle takes rknputest and charsiu_run from
  # woa-rk3576-npu at this commit (its main once npu-perfcounters, whose
  # merge of main this is, is fast-forwarded there), built with the same
  # llvm-mingw pin as that repository's CI.
  NPU_REPO: 'gahingwoo/woa-rk3576-npu'
  NPU_REF: '553cda8c97a9f209b04d4bc1e4451c05ea9ffcd7'
  LLVM_MINGW_TAG: '20261020'
  LLVM_MINGW_SHA256: '55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335'

jobs:
  checks:
    name: Structure & docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Driver package structure
        run: bash .github/scripts/check-structure.sh
      - name: Markdown relative links
        run: bash .github/scripts/check-links.sh
      - name: dwcmshc sdport miniport (IRQL, request ownership)
        run: python3 .github/scripts/check-sdport-miniport.py

  hcd:
    name: bcm4345bt patchram walker (Linux, gcc)
    # The driver's .hcd walker is plain C. Build it with the host tool and
    # run it over the patchram files install-firmware.ps1 can fetch, at the
    # same pinned commits and hashes, so a change to the walker that would
    # reject (or mis-split) the real files fails here. The files are only
    # downloaded into the runner, never stored or uploaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: |
          set -eux
          B=drivers/bluetooth/bcm4345bt
          gcc -std=c99 -O2 -Wall -Wextra -Werror -o hcdcheck tools/hcdcheck/main.c $B/hcd.c
          gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -c $B/hcd.c -o /dev/null
          fetch() {
            curl -fsSL -o "$1" "$2"
            echo "$3  $1" | sha256sum -c -
          }
          fetch ampak.hcd \
            https://raw.githubusercontent.com/armbian/firmware/6b6f053f6089e08dd2a675cda1ec813de2e842e2/brcm/BCM4345C5.hcd \
            f67164f0eda8d4ca96305e177a61542bf8b470f2f1c456b66fe8c660650f1c7a
          fetch rpi.hcd \
            https://raw.githubusercontent.com/RPi-Distro/bluez-firmware/cdf61dc691a49ff01a124752bd04194907f0f9cd/debian/firmware/broadcom/BCM4345C5.hcd \
            fb9f4ec2df5301bd35f416384e103c012c5983024c49aa72fbbaf90177512caa
          # the CM5-IO's BCM43752 (Bluetooth core BCM4362A2)
          fetch bcm4362a2.hcd \
            https://raw.githubusercontent.com/armbian/firmware/db8cc456dad5ad511b04f8a5130acda392cad20b/brcm/BCM4362A2.hcd \
            18901a5bef1d418b6895e92d0afae36234f4160b237465dfca3d75e9844e93ef
          ./hcdcheck ampak.hcd --records 198
          ./hcdcheck rpi.hcd --records 235
          ./hcdcheck bcm4362a2.hcd --records 508
          # the hashes in install-firmware.ps1 must be the ones checked here
          grep -qi f67164f0eda8d4ca96305e177a61542bf8b470f2f1c456b66fe8c660650f1c7a $B/install-firmware.ps1
          grep -qi fb9f4ec2df5301bd35f416384e103c012c5983024c49aa72fbbaf90177512caa $B/install-firmware.ps1
          grep -qi 18901a5bef1d418b6895e92d0afae36234f4160b237465dfca3d75e9844e93ef $B/install-firmware.ps1
          # a truncated file must be refused
          head -c 1000 ampak.hcd > trunc.hcd
          if ./hcdcheck trunc.hcd; then exit 1; fi
  harness:
    name: vdpu383 builder and parser (Linux, gcc)
    # The register builder (drivers/video/vdpu383/lib) and the test tool's
    # H.264 parser are plain C and build on any host; the tool's --null
    # device runs them without the decoder. -Werror here keeps the library
    # clean for a kernel-mode build later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test
        run: |
          set -eux
          L=drivers/video/vdpu383/lib
          T=tools/vdpu383test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror \
              -o vdpu383test $T/main.c $T/h264parse.c $T/hevcparse.c $T/vp9parse.c $T/av1parse.c $T/dev.c $T/md5.c \
              $T/dxva_check.c $L/vdpu383_h264.c $L/vdpu383_cabac.c $L/vdpu383_hevc.c $L/vdpu383_hevc_cabac.c \
              $L/vdpu383_vp9.c $L/vdpu383_vp9_probs.c $L/vdpu383_av1.c $L/vdpu383_av1_cdf.c
          ./vdpu383test selftest
          # the library alone, freestanding: no libc headers, no floats
          gcc -std=c99 -ffreestanding -nostdinc -fno-builtin -mgeneral-regs-only -Wall -Wextra -Werror \
              -c $L/vdpu383_h264.c -o /dev/null
          gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -c $L/vdpu383_cabac.c -o /dev/null
          gcc -std=c99 -ffreestanding -nostdinc -fno-builtin -mgeneral-regs-only -Wall -Wextra -Werror \
              -c $L/vdpu383_hevc.c -o /dev/null
          gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -c $L/vdpu383_hevc_cabac.c -o /dev/null
          gcc -std=c99 -ffreestanding -nostdinc -fno-builtin -mgeneral-regs-only -Wall -Wextra -Werror \
              -c $L/vdpu383_vp9.c -o /dev/null
          gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -c $L/vdpu383_vp9_probs.c -o /dev/null
          gcc -std=c99 -ffreestanding -nostdinc -fno-builtin -mgeneral-regs-only -Wall -Wextra -Werror \
              -c $L/vdpu383_av1.c -o /dev/null
          gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -c $L/vdpu383_av1_cdf.c -o /dev/null
      - name: HEVC conformance streams through the parser and the register builder (no device)
        run: |
          # FFmpeg's fate-suite copies of the JCT-VC conformance streams. Each
          # picture's reference sets are derived from its slice headers with
          # the SPS's sets and with the table rebuilt from DXVA alone, and
          # compared with what DXVA states; the frame count is FFmpeg's.
          set -eu
          mkdir -p hevc && cd hevc
          fail=0
          while read -r name frames; do
            curl -sfL --retry 3 -o "$name.bit" "https://fate-suite.ffmpeg.org/hevc-conformance/$name.bit"
            for mode in "" --dxva-only; do
              out=$(../vdpu383test --null decode "$name.bit" $mode)
              echo "$out" | grep -E '^(rps check|pictures|RASL)' | sed "s/^/$name ${mode:-sps}: /"
              echo "$out" | grep -q "frames out $frames," || { echo "$name: expected $frames frames"; fail=1; }
              echo "$out" | grep -q "with the SPS's sets 0 differ; rebuilt from DXVA 0 differ, 0 had no table" || fail=1
            done
          done <<'LIST'
          RPS_A_docomo_4 44
          RPS_F_docomo_1 50
          MERGE_A_TI_3 8
          POC_A_Bossen_3 5
          RAP_B_Bossen_1 80
          NoOutPrior_B_Qualcomm_1 47
          TSCL_A_VIDYO_5 73
          LTRPSPS_A_Qualcomm_1 500
          SLIST_D_Sony_9 65
          LIST
          exit $fail
      - name: VP9 test vectors through the parser and the register builder (no device)
        run: |
          # FFmpeg's fate-suite copies of the libvpx test vectors, remuxed to
          # IVF. Frame counts are FFmpeg's; every frame's address registers
          # must point into the tool's buffers (the driver's check).
          set -eu
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p vp9 && cd vp9
          fail=0
          while read -r name frames; do
            case $name in
              *.ivf) curl -sfL --retry 3 -o "${name%.ivf}.ivf" "https://fate-suite.ffmpeg.org/vp9-test-vectors/$name"
                     name=${name%.ivf} ;;
              *) curl -sfL --retry 3 -o "$name.webm" "https://fate-suite.ffmpeg.org/vp9-test-vectors/$name.webm"
                 ffmpeg -nostdin -v error -i "$name.webm" -c copy -copyinkf -f ivf "$name.ivf" ;;
            esac
            for mode in "" --dxva-only; do
              out=$(../vdpu383test --null decode "$name.ivf" $mode) || { echo "$name: exit $?"; fail=1; }
              echo "$out" | grep -E '^(vp9|address check)' | sed "s/^/$name ${mode:-parser}: /"
              echo "$out" | grep -q "frames out $frames," || { echo "$name: expected $frames frames"; fail=1; }
              echo "$out" | grep -q "address check: 0 frames" || fail=1
            done
          done <<'LIST'
          vp90-2-00-quantizer-00 2
          vp90-2-00-quantizer-63 2
          vp90-2-01-sharpness-4 10
          vp90-2-02-size-08x08 10
          vp90-2-02-size-66x66 10
          vp90-2-03-size-226x226 10
          vp90-2-03-deltaq 2
          vp90-2-05-resize.ivf 10
          vp90-2-06-bilinear 10
          vp90-2-09-lf_deltas 30
          vp90-2-10-show-existing-frame 13
          vp90-2-10-show-existing-frame2 16
          vp90-2-15-segkey_adpq 150
          vp90-2-16-intra-only 7
          vp90-2-2pass-akiyo 50
          vp90-2-parallelmode-akiyo 25
          vp90-2-segmentation-aq-akiyo 25
          vp90-2-segmentation-sf-akiyo 25
          vp90-2-tiling-pedestrian 2
          vp90-2-trac3849 10
          vp90-2-trac4359 4
          vp92-2-20-10bit-yuv420 10
          LIST
          exit $fail
      - name: AV1 test vectors through the parser and the register builder (no device)
        run: |
          # FFmpeg's fate-suite AV1 vectors (av1-test-vectors/ and av1/), IVF.
          # Frame counts are dav1d's; every frame's address registers must
          # point into the tool's buffers, with the frame's OBUs and with the
          # tile data wrapped as a D3D11 driver would have to (both ways).
          set -eu
          mkdir -p av1 && cd av1
          fail=0
          while read -r dir name frames; do
            curl -sfL --retry 3 -o "$name.ivf" "https://fate-suite.ffmpeg.org/$dir/$name.ivf"
            for mode in "" --dxva-only "--dxva-only --av1-synth 1"; do
              out=$(../vdpu383test --null decode "$name.ivf" $mode) || { echo "$name: exit $?"; fail=1; }
              echo "$out" | grep -E '^(av1|address check)' | sed "s/^/$name ${mode:-parser}: /"
              echo "$out" | grep -q "frames out $frames," || { echo "$name: expected $frames frames"; fail=1; }
              echo "$out" | grep -q "address check: 0 frames" || fail=1
            done
          done <<'LIST'
          av1-test-vectors av1-1-b8-02-allintra 39
          av1-test-vectors av1-1-b8-03-sizedown 20
          av1-test-vectors av1-1-b8-03-sizeup 20
          av1-test-vectors av1-1-b8-04-cdfupdate 2
          av1-test-vectors av1-1-b8-05-mv 4
          av1-test-vectors av1-1-b8-06-mfmv 4
          av1-test-vectors av1-1-b8-22-svc-L1T2 8
          av1-test-vectors av1-1-b8-22-svc-L2T1 8
          av1-test-vectors av1-1-b8-22-svc-L2T2 8
          av1-test-vectors av1-1-b8-23-film_grain-50 10
          av1-test-vectors av1-1-b10-23-film_grain-50 10
          av1 decode_model 24
          av1 film_grain 10
          av1 frames_refs_short_signaling 50
          av1 non_uniform_tiling 24
          av1 seq_hdr_op_param_info 64
          av1 switch_frame 32
          LIST
          exit $fail

  bwltest:
    name: bcmwlsdio core against a simulated chip (Linux, gcc)
    # The Wi-Fi driver's SDIO, chip, firmware and protocol code is plain C
    # (drivers/net/bcmwlsdio/bwl*.c). Build it with tools/bwltest, which
    # runs it against a simulated BCM43456 and BCM43752: unit tests, then attach,
    # download, start and control commands with synthetic files, then the
    # station against simulated access points (escan, open and WPA2-PSK
    # joins with the host's and the firmware's supplicant, keys, data
    # frames through the credit window, deauthentication); then the
    # same bring-up with the real firmware files install-firmware.ps1
    # fetches, at the same pinned commits and hashes. The files are only
    # downloaded into the runner, never stored or uploaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: |
          set -eux
          B=drivers/net/bcmwlsdio
          SRC="$B/bwl_sdio.c $B/bwl_chip.c $B/bwl_bringup.c $B/bwl_fw.c $B/bwl_proto.c $B/bwl_ctl.c $B/bwl_wlan.c $B/bwl_data.c"
          gcc -std=c99 -O2 -Wall -Wextra -Werror -o bwltest tools/bwltest/main.c tools/bwltest/fakechip.c $SRC
          gcc -std=c99 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra -Werror \
              -o bwltest-asan tools/bwltest/main.c tools/bwltest/fakechip.c $SRC
          # the core must build with no libc at all, as it does in the driver
          for f in $SRC; do gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -c "$f" -o /dev/null; done
          ./bwltest
          ./bwltest-asan
          fetch() {
            curl -fsSL -o "$1" "$2"
            echo "$3  $1" | sha256sum -c -
          }
          A=https://raw.githubusercontent.com/armbian/firmware/db8cc456dad5ad511b04f8a5130acda392cad20b/brcm
          R=https://raw.githubusercontent.com/RPi-Distro/firmware-nonfree/b1833f18a816cf8fd73ca86e27f9eecea11bf991/debian/added-firmware/brcm
          mkdir -p armbian rpi
          fetch armbian/brcmfmac43456-sdio.bin $A/brcmfmac43456-sdio.bin \
            3167956a7b2cffc4cfcaf6a282b95728c529eebef18a5d9e6d9ff32de32cc67c
          fetch armbian/brcmfmac43456-sdio.txt $A/brcmfmac43456-sdio.txt \
            66c71eb53b47c49d42386b66735134578640b0946f3f46e44f384fef5aacfd9e
          fetch armbian/brcmfmac43456-sdio.clm_blob $A/brcmfmac43456-sdio.clm_blob \
            2dbd7d22fc9af0eb560ceab45b19646d211bc7b34a1dd00c6bfac5dd6ba25e8a
          fetch rpi/brcmfmac43456-sdio.bin $R/brcmfmac43456-sdio.bin \
            dc4429f13b59f8c271e940c28b2a197455a8e02270fcc7a2f9036aa1e4c739fb
          fetch rpi/brcmfmac43456-sdio.clm_blob $R/brcmfmac43456-sdio.clm_blob \
            2dbd7d22fc9af0eb560ceab45b19646d211bc7b34a1dd00c6bfac5dd6ba25e8a
          cp armbian/brcmfmac43456-sdio.txt rpi/
          ./bwltest-asan files armbian --version 7.45.96.0 --clm-chunks 6
          ./bwltest-asan files rpi --version 7.45.96.252 --clm-chunks 6
          # the CM5-IO's BCM43752 set, same Armbian commit, against the simulated 43752
          fetch armbian/brcmfmac43752-sdio.bin $A/brcmfmac43752-sdio.bin \
            46f62076768e50938d0e29b306b24d4663de20b07b474c4759d5801fcbf0bdde
          fetch armbian/brcmfmac43752-sdio.txt $A/brcmfmac43752-sdio.txt \
            2d2723101fe9c66c853ddb1e2d715851ba100a4390f8ac72fc84dd35736cc66f
          fetch armbian/brcmfmac43752-sdio.clm_blob $A/brcmfmac43752-sdio.clm_blob \
            5143146e1923f87f7aab8df043abcf89a657fa9fdc3b22a38806399730d9a97a
          ./bwltest-asan files armbian --chip 43752 --version 18.35.387.23.7 --clm-chunks 21
          # the hashes in install-firmware.ps1 must be the ones checked here
          for h in 3167956a7b2cffc4cfcaf6a282b95728c529eebef18a5d9e6d9ff32de32cc67c \
                   66c71eb53b47c49d42386b66735134578640b0946f3f46e44f384fef5aacfd9e \
                   2dbd7d22fc9af0eb560ceab45b19646d211bc7b34a1dd00c6bfac5dd6ba25e8a \
                   dc4429f13b59f8c271e940c28b2a197455a8e02270fcc7a2f9036aa1e4c739fb \
                   46f62076768e50938d0e29b306b24d4663de20b07b474c4759d5801fcbf0bdde \
                   2d2723101fe9c66c853ddb1e2d715851ba100a4390f8ac72fc84dd35736cc66f \
                   5143146e1923f87f7aab8df043abcf89a657fa9fdc3b22a38806399730d9a97a; do
            grep -qi "$h" $B/install-firmware.ps1
          done

  pageverify:
    name: pageverify (Linux, gcc)
    # The page-integrity tool is portable C. The Linux build is the one used
    # on the PC to make pattern files that are then copied to the board, so
    # it is built and self-tested here, then run end to end: write, verify,
    # plant a foreign page and a misplaced page, verify again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: |
          set -eux
          gcc -std=c11 -O2 -Wall -Wextra -Werror -o pageverify tools/pageverify/pageverify.c
          ./pageverify selftest
          ./pageverify write t.bin 32 --seed 1234
          ./pageverify verify t.bin --passes 2
          head -c 4096 /dev/urandom | dd of=t.bin bs=4096 seek=100 conv=notrunc
          dd if=t.bin of=t.bin bs=4096 skip=3 seek=200 count=1 conv=notrunc
          set +e
          ./pageverify verify t.bin > out.txt
          rc=$?
          set -e
          cat out.txt
          test "$rc" -eq 1
          grep -q 'BAD page 100 at offset 0x64000' out.txt
          grep -q 'BAD page 200 at offset 0xc8000.*misplaced page of THIS file.*page 3 ' out.txt
          ./pageverify loop . 8 --rounds 2
      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: pageverify-linux-x64
          path: pageverify

  rk-monitor:
    name: rk-monitor tray app (ARM64, x64)
    # A plain Win32 program, no WDK. The x64 build runs here with --once,
    # which prints one sample: the runner has CPU counters and no RK3576
    # ones, so the CPU rows must have numbers and the GPU and NPU rows must
    # say their counters are missing, without the program failing.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build
        shell: pwsh
        run: |
          foreach ($plat in 'ARM64', 'x64') {
            msbuild tools/rk-monitor/rk-monitor.vcxproj /p:Configuration=Release /p:Platform=$plat /m /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for $plat" }
          }
      - name: Run once (x64)
        shell: pwsh
        run: |
          $exe = 'tools\rk-monitor\x64\Release\rk-monitor.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--once' -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput once.txt
          Get-Content once.txt
          if ($p.ExitCode -ne 0) { throw "rk-monitor --once exited $($p.ExitCode)" }
          $t = Get-Content -Raw once.txt
          if ($t -notmatch '(?m)^CPU') { throw 'no CPU section' }
          if ($t -notmatch 'found\s+\\Processor\(\*\)') { throw 'the Processor counters were not found' }
          if ($t -notmatch 'driver has no counters') { throw 'the missing NPU counter set is not reported' }
          if ($t -notmatch 'RK3576 GPU counters not registered') { throw 'the missing GPU counter set is not reported' }
          # the headphone auto-switch reports its state (and changes nothing): no Rockchip endpoint here
          if ($t -notmatch '(?m)^audio switch: on; Windows build \d+') { throw 'no audio switch line' }
          if ($t -notmatch 'headphones: no Rockchip headphone endpoint') { throw 'the audio switch found a headphone endpoint on the runner' }
      - name: Stage
        shell: pwsh
        run: |
          foreach ($plat in 'ARM64', 'x64') {
            $d = "stage\$plat"
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Copy-Item "tools\rk-monitor\$plat\Release\rk-monitor.exe", tools\rk-monitor\README.md, LICENSE $d
          }
          Get-ChildItem stage -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: rk-monitor-arm64
          path: stage/ARM64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rk-monitor-x64
          path: stage/x64
          if-no-files-found: error

  npu-charsiu:
    name: charsiu_run for the RK3576 tools (llvm-mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NPU_REPO }}
          ref: ${{ env.NPU_REF }}
          submodules: true
      - name: llvm-mingw
        run: |
          set -eux
          f=llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$f" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/$f"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/$f"
          echo "LLVM_MINGW=$RUNNER_TEMP/${f%.tar.xz}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -eux
          make -C port win LLVM_MINGW="$LLVM_MINGW"
          "$LLVM_MINGW/bin/llvm-objdump" -f port/build/win/charsiu_run.exe | grep -q 'file format coff-arm64'
          out="$RUNNER_TEMP/npu"
          mkdir -p "$out/licenses"
          cp port/build/win/charsiu_run.exe tools/rknpu-perfcounters.ps1 "$out/"
          cp external/charsiu/LICENSE "$out/licenses/charsiu-LICENSE.txt"
          cp port/libm/LICENSE.optimized-routines "$out/licenses/optimized-routines-LICENSE.txt"
          cp LICENSE "$out/licenses/woa-rk3576-npu-LICENSE.txt"
          printf 'woa-rk3576-npu %s\ncharsiu %s\n' "$(git rev-parse HEAD)" \
            "$(git -C external/charsiu rev-parse HEAD)" > "$out/commits.txt"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: npu-tools-linux-build
          path: ${{ runner.temp }}/npu
          if-no-files-found: error
          retention-days: 3

  browser-gpu:
    name: Browser GPU switch (tests on Windows PowerShell 5.1, the runner's own Edge and Chrome)
    # tools/rk3576-tools/setup/rk3576-browser-gpu.ps1 (BROWSER-GPU.md). The
    # unit tests work on a made-up machine under HKCU and on .lnk files in
    # a temporary folder. Then the real thing on the runner: the runner has
    # no RK3576, so the gate says no and an install changes nothing; with
    # Mode 2 (always) the switch must land on the runner's Edge and Chrome
    # open commands and Start menu shortcuts, and Uninstall must give back
    # exactly what was there before.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in 'tools\rk3576-tools\setup\rk3576-browser-gpu.ps1', 'tools\rk3576-tools\tests\browser-gpu.tests.ps1') {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e)
            if ($e) { $e | Out-Host; throw "parse errors in $f" }
          }
          $PSVersionTable.PSVersion
      - name: Unit tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\rk3576-tools\tests\browser-gpu.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "browser-gpu.tests.ps1 failed" }
      - name: Unit tests (PowerShell 7)
        shell: pwsh
        run: |
          & tools\rk3576-tools\tests\browser-gpu.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "browser-gpu.tests.ps1 failed under pwsh" }
      - name: Install, force, uninstall on the runner's Edge and Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $s = (Resolve-Path tools\rk3576-tools\setup\rk3576-browser-gpu.ps1).Path
          $SW = '--disable-direct-composition'
          function Snap {
            $o = [ordered]@{}
            foreach ($n in 'MSEdgeHTM', 'MSEdgePDF', 'microsoft-edge', 'ChromeHTML', 'ChromePDF') {
              $k = "HKLM:\SOFTWARE\Classes\$n\shell\open\command"
              if (Test-Path $k) { $o[$k] = (Get-Item $k).GetValue('', $null, 'DoNotExpandEnvironmentNames') }
            }
            $sh = New-Object -ComObject WScript.Shell
            foreach ($f in Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:PUBLIC\Desktop" -Recurse -Filter *.lnk -ErrorAction SilentlyContinue) {
              $l = $sh.CreateShortcut($f.FullName)
              if ($l.TargetPath -match '(msedge|chrome)\.exe$') { $o[$f.FullName] = $l.Arguments }
            }
            $o['env'] = [Environment]::GetEnvironmentVariable('WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS', 'Machine')
            foreach ($p in 'Microsoft\Edge|StartupBoostEnabled', 'Microsoft\Edge|BackgroundModeEnabled', 'Google\Chrome|BackgroundModeEnabled') {
              $a = $p -split '\|'
              $o[$p] = (Get-ItemProperty "HKLM:\SOFTWARE\Policies\$($a[0])" -ErrorAction SilentlyContinue).($a[1])
            }
            return $o
          }
          function Same($a, $b) { ($a | ConvertTo-Json) -eq ($b | ConvertTo-Json) }
          $before = Snap
          $before | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
          if (-not ($before.Keys | Where-Object { $_ -like '*MSEdgeHTM*' })) { throw 'the runner has no MSEdgeHTM: the test proves nothing' }

          & powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action Status
          & powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action Install
          if ($LASTEXITCODE -ne 0) { throw "Install exited $LASTEXITCODE" }
          $t = Get-ScheduledTask -TaskPath '\RK3576\' -TaskName 'Browser GPU'
          if ($t.Principal.UserId -notmatch 'SYSTEM|S-1-5-18') { throw "task principal $($t.Principal.UserId)" }
          if ($t.Triggers.Count -ne 4) { throw "task triggers: $($t.Triggers.Count)" }
          if (-not (Test-Path "$env:ProgramFiles\RK3576\browser-gpu\rk3576-browser-gpu.ps1")) { throw 'installed copy' }
          if (-not (Same $before (Snap))) { throw 'the gate said no (no RK3576 here) but something changed' }
          Get-Content "$env:ProgramData\RK3576\browser-gpu.log"

          reg add HKLM\SOFTWARE\RK3576\BrowserGpu /v Mode /t REG_DWORD /d 2 /f | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action Apply -DryRun
          if (-not (Same $before (Snap))) { throw 'a dry run changed something' }
          # what the task runs
          Start-ScheduledTask -TaskPath '\RK3576\' -TaskName 'Browser GPU'
          $deadline = (Get-Date).AddMinutes(3)
          do { Start-Sleep 2; $st = (Get-ScheduledTask -TaskPath '\RK3576\' -TaskName 'Browser GPU').State } while ($st -eq 'Running' -and (Get-Date) -lt $deadline)
          $info = Get-ScheduledTaskInfo -TaskPath '\RK3576\' -TaskName 'Browser GPU'
          Write-Host "task result $($info.LastTaskResult)"
          if ($info.LastTaskResult -ne 0) { throw "the task's run failed: $($info.LastTaskResult)" }
          $after = Snap
          $after | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
          foreach ($k in $before.Keys) {
            if ($k -like 'HKLM:*') {
              $c = $after[$k]
              if ($c -match '(msedge|chrome)\.exe"' -and $c -notmatch ('\.exe" ' + $SW + '( |$)')) { throw "no switch right after the program: $k = $c" }
            } elseif ($k -like '*.lnk') {
              if ($after[$k] -notmatch "^$SW") { throw "shortcut without the switch: $k" }
            }
          }
          if ($after['env'] -notmatch $SW) { throw 'WebView2 variable' }
          if ($after['Microsoft\Edge|StartupBoostEnabled'] -ne 0 -or $after['Google\Chrome|BackgroundModeEnabled'] -ne 0) { throw 'policies' }
          Get-Content "$env:ProgramData\RK3576\browser-gpu.log"
          # running it again changes nothing
          $n = (Get-Content "$env:ProgramData\RK3576\browser-gpu.log").Count
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\RK3576\browser-gpu\rk3576-browser-gpu.ps1" -Action Apply -Quiet
          if ((Get-Content "$env:ProgramData\RK3576\browser-gpu.log").Count -ne $n) { throw 'a second Apply logged changes' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action Status

          # Disable keeps the task and takes everything out; Apply then does nothing
          & powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action Disable
          if (-not (Same $before (Snap))) { throw 'Disable did not give everything back' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action Apply
          if (-not (Same $before (Snap))) { throw 'Apply with Mode 0 changed something' }
          reg add HKLM\SOFTWARE\RK3576\BrowserGpu /v Mode /t REG_DWORD /d 2 /f | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action Apply -Quiet

          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\RK3576\browser-gpu\rk3576-browser-gpu.ps1" -Action Uninstall
          if ($LASTEXITCODE -ne 0) { throw "Uninstall exited $LASTEXITCODE" }
          $end = Snap
          if (-not (Same $before $end)) {
            $before | ConvertTo-Json | Write-Host; $end | ConvertTo-Json | Write-Host
            throw 'Uninstall did not give back what was there'
          }
          $left = @()
          if (Get-ScheduledTask -TaskPath '\RK3576\' -ErrorAction SilentlyContinue) { $left += 'task' }
          if (Test-Path "$env:ProgramFiles\RK3576\browser-gpu") { $left += 'files' }
          if (Test-Path 'HKLM:\SOFTWARE\RK3576\BrowserGpu') { $left += 'settings' }
          if ($left) { throw "left after uninstall: $($left -join ', ')" }
          Write-Host 'install, force, disable and uninstall: everything as it was'

  rk3576-tools:
    name: RK3576 tools bundle (install, uninstall, offline install)
    # rk-monitor, rknputest and charsiu_run in the layout of
    # %ProgramFiles%\RK3576, with install.cmd, uninstall.cmd and
    # offline-install.cmd. The runner (x64, administrator) installs an x64
    # build of the same bundle, checks every file, registry value, shortcut
    # and task, uninstalls and checks that nothing is left; then the
    # offline installer runs against a stand-in Windows root with its own
    # SOFTWARE hive.
    needs: npu-charsiu
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NPU_REPO }}
          ref: ${{ env.NPU_REF }}
          path: npu
      - uses: actions/download-artifact@v4
        with:
          name: npu-tools-linux-build
          path: npu-built
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build rk-monitor and rknputest
        shell: pwsh
        run: |
          foreach ($plat in 'ARM64', 'x64') {
            msbuild tools/rk-monitor/rk-monitor.vcxproj /p:Configuration=Release /p:Platform=$plat /m /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "rk-monitor $plat" }
          }
          msbuild npu/tools/rknputest/rknputest.vcxproj /p:Configuration=Release /p:Platform=ARM64 `
                  /p:WindowsTargetPlatformVersion=$env:WDK_VERSION /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'rknputest' }
      - name: Assemble
        shell: pwsh
        run: |
          function Bundle([string]$plat, [string]$out) {
            $p = Join-Path $out 'RK3576'
            New-Item -ItemType Directory -Force -Path "$p\npu\licenses", "$p\setup" | Out-Null
            Copy-Item "tools\rk-monitor\$plat\Release\rk-monitor.exe" $p
            Copy-Item npu\tools\rknputest\ARM64\Release\rknputest.exe "$p\npu"
            Copy-Item npu-built\charsiu_run.exe, npu-built\rknpu-perfcounters.ps1 "$p\npu"
            Copy-Item npu-built\licenses\* "$p\npu\licenses"
            Copy-Item tools\rk3576-tools\setup\* "$p\setup"
            Copy-Item tools\rk3576-tools\README.md, tools\rk3576-tools\BROWSER-GPU.md $p
            Copy-Item tools\rk3576-tools\README.md, tools\rk3576-tools\*.cmd $out
            Copy-Item LICENSE "$p\LICENSE.txt"
            $ver = "0.1.0+$($env:GITHUB_SHA.Substring(0,7))"
            @($ver, "woa-rk3576 $env:GITHUB_SHA") + (Get-Content npu-built\commits.txt) |
              Set-Content -Path "$p\VERSION.txt" -Encoding ascii
          }
          Bundle 'ARM64' 'stage\rk3576-tools'
          Bundle 'x64' 'test\rk3576-tools'
          Get-ChildItem stage -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          Get-Content stage\rk3576-tools\RK3576\VERSION.txt
      - name: Scripts parse
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tools\rk3576-tools -Recurse -Filter *.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e) { $e; throw "parse errors in $($f.Name)" }
          }
      - name: Install, check, uninstall, check (x64 build)
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'RK3576'
          $menu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\RK3576'
          & test\rk3576-tools\install.cmd /quiet /nostart
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:ProgramData\RK3576\setup.log"; throw "install.cmd exited $LASTEXITCODE" }
          Get-Content "$env:ProgramData\RK3576\setup.log"
          foreach ($f in 'rk-monitor.exe', 'npu\rknputest.exe', 'npu\charsiu_run.exe', 'npu\rknpu-perfcounters.ps1',
                         'setup\rk3576-setup.ps1', 'setup\rk3576-counters.ps1', 'setup\uninstall.cmd',
                         'setup\firstboot.cmd', 'setup\rk3576-browser-gpu.ps1', 'browser-gpu\rk3576-browser-gpu.ps1',
                         'VERSION.txt', 'LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          # rk-monitor starts from a logon task for the Users group, not from a Run entry
          if ((Get-Item 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').GetValue('RK3576 Monitor')) { throw 'a Run entry next to the logon task' }
          $lt = Get-ScheduledTask -TaskPath '\RK3576\' -TaskName 'RK3576 Monitor'
          $lt.Principal | Format-List | Out-String | Write-Host
          if ($lt.Principal.GroupId -notmatch 'S-1-5-32-545|Users') { throw "logon task principal: $($lt.Principal.GroupId)" }
          if ($lt.Principal.RunLevel -ne 'Limited') { throw 'logon task elevated' }
          if ($lt.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger' -or $lt.Triggers[0].UserId) { throw 'logon trigger is not for any user' }
          if ($lt.Actions[0].Execute -ne (Join-Path $dir 'rk-monitor.exe') -or $lt.Actions[0].Arguments -ne '--autostart') { throw 'logon task action' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\RK3576\Monitor').AutostartTask -ne 1) { throw 'AutostartTask' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\RK3576\Monitor').Widget -ne 1) { throw 'Widget default' }
          if (-not (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\RK3576Tools').UninstallString) { throw 'ARP' }
          foreach ($l in 'RK3576 Monitor.lnk', 'RK3576 tools folder.lnk', 'Uninstall RK3576 tools.lnk') {
            if (-not (Test-Path (Join-Path $menu $l))) { throw "missing shortcut $l" }
          }
          # an offline install's Run entry, which the install must replace with the task
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'RK3576 Monitor' -Value 'x' -Force | Out-Null
          $t = Get-ScheduledTask -TaskPath '\RK3576\' -TaskName 'Performance counters'
          if ($t.Principal.UserId -ne 'SYSTEM') { throw 'task principal' }
          # Edge, Chrome and WebView2 on the GPU: the task is there; no RK3576 here, so nothing was changed
          $bt = Get-ScheduledTask -TaskPath '\RK3576\' -TaskName 'Browser GPU'
          if ($bt.Principal.UserId -notmatch 'SYSTEM|S-1-5-18') { throw 'browser GPU task principal' }
          Get-Content "$env:ProgramData\RK3576\browser-gpu.log"
          Get-Content "$env:ProgramData\RK3576\counters.log"
          # the installed program runs (no RK3576 counters on the runner)
          $p = Start-Process -FilePath (Join-Path $dir 'rk-monitor.exe') -ArgumentList '--once' -Wait -PassThru -NoNewWindow -RedirectStandardOutput once.txt
          Get-Content once.txt
          if ($p.ExitCode -ne 0) { throw 'rk-monitor --once' }
          # a per-user setting, to see the uninstall take it away
          New-Item -Path 'HKCU:\Software\RK3576\Monitor' -Force | New-ItemProperty -Name WidgetX -Value 5 -PropertyType DWord | Out-Null
          # upgrade in place
          & test\rk3576-tools\install.cmd /quiet /nostart
          if ($LASTEXITCODE -ne 0) { throw "second install.cmd exited $LASTEXITCODE" }
          if ((Get-Item 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').GetValue('RK3576 Monitor')) { throw 'the upgrade kept the Run entry' }

          & "$dir\setup\uninstall.cmd" /quiet
          if ($LASTEXITCODE -ne 0) { throw "uninstall.cmd exited $LASTEXITCODE" }
          $left = @()
          foreach ($x in $dir, $menu, "$env:ProgramData\RK3576", 'HKLM:\SOFTWARE\RK3576', 'HKCU:\Software\RK3576',
                         'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\RK3576Tools') {
            if (Test-Path $x) { $left += $x }
          }
          if ((Get-Item 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').GetValue('RK3576 Monitor')) { $left += 'Run value' }
          if (Get-ScheduledTask -TaskPath '\RK3576\' -ErrorAction SilentlyContinue) { $left += 'task' }
          if ($left) { throw "left after uninstall: $($left -join ', ')" }
          Write-Host 'uninstall removed everything'
      - name: Offline install into a stand-in Windows root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'img'
          New-Item -ItemType Directory -Force -Path "$root\Windows\System32\config", "$root\Program Files" | Out-Null
          # an empty hive file to stand for the image's SOFTWARE
          reg add HKCU\Software\Rk3576HiveSeed /f | Out-Null
          reg save HKCU\Software\Rk3576HiveSeed "$root\Windows\System32\config\SOFTWARE" /y | Out-Null
          reg delete HKCU\Software\Rk3576HiveSeed /f | Out-Null
          & stage\rk3576-tools\offline-install.cmd $root /hook
          if ($LASTEXITCODE -ne 0) { throw "offline-install.cmd exited $LASTEXITCODE" }
          if (-not (Test-Path "$root\Program Files\RK3576\rk-monitor.exe")) { throw 'files' }
          $sc = Get-Content -Raw "$root\Windows\Setup\Scripts\SetupComplete.cmd"
          Write-Host $sc
          if ($sc -notmatch [regex]::Escape('call "%ProgramFiles%\RK3576\setup\firstboot.cmd"')) { throw 'SetupComplete hook' }
          reg load HKLM\RKTEST "$root\Windows\System32\config\SOFTWARE" | Out-Null
          try {
            reg query HKLM\RKTEST /s
            $run = (Get-Item 'HKLM:\RKTEST\Microsoft\Windows\CurrentVersion\Run').GetValue('RK3576 Monitor', $null, 'DoNotExpandEnvironmentNames')
            $kind = (Get-Item 'HKLM:\RKTEST\Microsoft\Windows\CurrentVersion\Run').GetValueKind('RK3576 Monitor')
            if ($run -ne '"%ProgramFiles%\RK3576\rk-monitor.exe" --autostart' -or $kind -ne 'ExpandString') { throw "Run: $kind $run" }
            if ((Get-ItemProperty 'HKLM:\RKTEST\RK3576\Monitor').Widget -ne 1) { throw 'Widget' }
            if ((Get-ItemProperty 'HKLM:\RKTEST\RK3576').FirstBootPending -ne 1) { throw 'FirstBootPending' }
            $u = (Get-Item 'HKLM:\RKTEST\Microsoft\Windows\CurrentVersion\Uninstall\RK3576Tools').GetValue('UninstallString', $null, 'DoNotExpandEnvironmentNames')
            if ($u -ne '"%ProgramFiles%\RK3576\setup\uninstall.cmd"') { throw "UninstallString: $u" }
          } finally {
            [GC]::Collect()
            reg unload HKLM\RKTEST | Out-Null
          }
          Write-Host 'offline install wrote what the README says'
      - uses: actions/upload-artifact@v4
        with:
          name: rk3576-tools-arm64
          path: stage/rk3576-tools
          if-no-files-found: error

  # The tools bundle on the rolling "ci" pre-release, as
  # rk3576-tools-arm64.zip with its line in SHA256SUMS.txt, for Maskrom
  # Studio's "install RK3576 tools" on the CI channel (it takes the first
  # rk3576-tools-arm64*.zip of the release). The zip holds one folder,
  # rk3576-tools/, with offline-install.cmd at its top. winpe.yml writes the
  # WinPE image to the same release; ci-release.sh keeps each workflow's
  # files and serialises on the same concurrency group.
  tools-release:
    name: Rolling "ci" release (RK3576 tools)
    needs: [checks, rk3576-tools, solution, build, null-devices]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: woa-ci-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: rk3576-tools-arm64
          path: pkg/rk3576-tools
      - name: Zip
        run: |
          set -eu
          test -f pkg/rk3576-tools/offline-install.cmd
          mkdir rel
          (cd pkg && zip -q -r -X ../rel/rk3576-tools-arm64.zip rk3576-tools)
          unzip -l rel/rk3576-tools-arm64.zip
          cat pkg/rk3576-tools/RK3576/VERSION.txt
      - name: Update the ci release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-release.sh '^rk3576-tools-arm64.*\.zip$' rel/rk3576-tools-arm64.zip

  null-devices:
    name: rk3576-null.inf (no-driver devices, test-signed)
    # An INF-only package: no binary to build, but Windows will not stage
    # it without a signed catalog. infverif /v must pass; DriverVer is
    # stamped with the run number so a newer package always outranks an
    # older one at a CONFIGFLAG_REINSTALL restart.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Script parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tok = $null; $err = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path drivers\null\null-devices-reinstall.ps1), [ref]$tok, [ref]$err)
          if ($err) { $err | Out-Host; throw 'null-devices-reinstall.ps1 does not parse' }
      - name: Validate, stamp, catalog, sign, verify
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $st   = Join-Path $kits "bin\$env:WDK_VERSION\x86\signtool.exe"
          $i2c  = Join-Path $kits "bin\$env:WDK_VERSION\x86\inf2cat.exe"
          $iv   = (Get-ChildItem $kits -Recurse -Filter infverif.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          if (-not $iv) { throw 'infverif.exe not found' }
          $pkg = Join-Path $env:RUNNER_TEMP 'rk3576-null-arm64'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item drivers\null\rk3576-null.inf, drivers\null\null-devices-reinstall.ps1, drivers\null\README.md $pkg
          $inf = Join-Path $pkg 'rk3576-null.inf'
          $dv = 'DriverVer   = {0},1.0.{1}.{2}' -f (Get-Date -Format 'MM/dd/yyyy'), $env:GITHUB_RUN_NUMBER, $env:GITHUB_RUN_ATTEMPT
          (Get-Content $inf) -replace '^DriverVer\s*=.*$', $dv | Set-Content -Encoding ascii $inf
          Select-String -Path $inf -Pattern '^DriverVer' | Out-Host
          & $iv /v $inf
          if ($LASTEXITCODE) { throw "infverif /v failed: $LASTEXITCODE" }
          & $iv /w $inf
          Write-Host "infverif /w: exit $LASTEXITCODE (informational)"
          $global:LASTEXITCODE = 0
          $pw = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=woa-rk3576 null-devices test signing' `
                    -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
          $pfx = Join-Path $env:RUNNER_TEMP 'n.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $pkg 'rk3576-null-test.cer') | Out-Null
          # 23H2 is 10_NI; the INF's floor is 16299 (10_RS3).
          & $i2c /driver:"$pkg" /os:10_RS3_ARM64,10_RS4_ARM64,10_RS5_ARM64,10_19H1_ARM64,10_VB_ARM64,10_CO_ARM64,10_NI_ARM64
          if ($LASTEXITCODE) { throw "inf2cat failed: $LASTEXITCODE" }
          $cat = Join-Path $pkg 'rk3576-null.cat'
          & $st sign /fd sha256 /f $pfx /p $pw $cat
          if ($LASTEXITCODE) { throw "signtool failed: $LASTEXITCODE" }
          Remove-Item $pfx
          certutil -f -addstore Root (Join-Path $pkg 'rk3576-null-test.cer') | Out-Null
          & $st verify /pa /q /c $cat $inf
          if ($LASTEXITCODE) { throw 'the INF is not in the catalog, or the catalog does not verify' }
          certutil -delstore Root $cert.Thumbprint | Out-Null
          $global:LASTEXITCODE = 0
          "DriverVer $dv`r`nCI run $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`r`nCommit $env:GITHUB_SHA`r`nCertificate SHA1 $($cert.Thumbprint)" |
            Set-Content -Encoding ascii (Join-Path $pkg 'BUILD.txt')
          Get-ChildItem $pkg | Format-Table Name, Length | Out-Host
          "NULLPKG=$pkg" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: rk3576-null-arm64
          path: ${{ env.NULLPKG }}
          if-no-files-found: error

  regress-linux:
    name: regression suite (shellcheck, regress.sh on made-up boards, dry runs under pwsh)
    # tools/regress: no board is reachable from CI, so the Linux suite runs
    # against /sys and /proc trees the test builds (REGRESS_ROOT) and the
    # Windows suite against recorded facts (-DryRun -Mock).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Board manifests are JSON
        run: for f in tools/regress/boards/*.json tools/regress/tests/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::not JSON"; exit 1; }; done
      - name: shellcheck
        run: shellcheck -S warning tools/regress/*.sh tools/regress/tests/*.sh
      - name: regress.sh and run-remote.sh against made-up boards
        run: bash tools/regress/tests/test-regress-sh.sh
      - name: regress.ps1 dry runs (PowerShell 7)
        shell: pwsh
        run: |
          & tools/regress/tests/run-dryrun.ps1
          if ($LASTEXITCODE -ne 0) { throw "run-dryrun.ps1 failed" }

  regress-windows:
    name: regression suite (Windows PowerShell 5.1 parse, dry runs, live smoke run)
    # The boards run Windows PowerShell 5.1, so the suite is parsed and
    # dry-run there, then run live once on the runner (an x64 VM, not a
    # board): most rows FAIL or SKIP, but every collector, the C# helper
    # (PDH counters, ACPI table read) included, has to run to the end.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and dry-run (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\regress\tests\run-dryrun.ps1
          if ($LASTEXITCODE -ne 0) { throw "run-dryrun.ps1 failed" }
      - name: Live smoke run on the runner (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'regress-live'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\regress\regress.ps1 -Board tspi3m -Quick -Out $out
          $code = $LASTEXITCODE
          Get-Content (Join-Path $out 'results.md')
          if ($code -ne 0 -and $code -ne 1) { throw "regress.ps1 exited $code" }
          $r = Get-Content -Raw (Join-Path $out 'results.json') | ConvertFrom-Json
          $ids = @($r.results | ForEach-Object { $_.id })
          foreach ($want in 'fw.banner', 'fw.acpi', 'cpu.count', 'devmgr', 'gpu.driver', 'display.mode', 'net.ethernet',
                            'usb.controllers', 'storage.rw', 'thermal.zones', 'time.clock', 'stress.furmark', 'display.tdr') {
            if ($ids -notcontains $want) { throw "no row ${want}: the run stopped early" }
          }
          $row = { param($i) $r.results | Where-Object { $_.id -eq $i } | Select-Object -First 1 }
          # the C# helper compiled and read the runner's own DSDT header
          if (-not (& $row 'fw.acpi').value) { throw 'fw.acpi read nothing: the native helper did not work' }
          if ([int](& $row 'cpu.count').value -lt 1) { throw 'cpu.count read nothing' }
          if ((& $row 'storage.rw').status -ne 'PASS') { throw "storage.rw: $((& $row 'storage.rw').reason)" }
          # it cleaned up after itself
          if (Get-ChildItem $env:SystemDrive\ -Filter 'rk3576-regress-*.bin' -ErrorAction SilentlyContinue) { throw 'the storage check left its file' }
          if (Get-ScheduledTask -TaskName 'RK3576-regress-*' -ErrorAction SilentlyContinue) { throw 'a session task was left behind' }
          # the suite's own exit code (1: rows FAIL on a VM) is not this step's
          exit 0

  saradc-logic:
    name: rk3xsaradc thresholds and debounce (Linux, gcc)
    # The key, jack and HID-mapping decisions of drivers/adc/rk3xsaradc are
    # plain C with no WDK dependency; run their unit test, and build the
    # file freestanding the way the kernel build sees it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          set -eux
          D=drivers/adc/rk3xsaradc
          gcc -std=c11 -O2 -Wall -Wextra -Werror -o saradc_logic_test $D/test/saradc_logic_test.c $D/saradc_logic.c
          ./saradc_logic_test
          gcc -std=c99 -ffreestanding -nostdinc -fno-builtin -Wall -Wextra -Werror -c $D/saradc_logic.c -o /dev/null
          # the interface header alone, as a host program sees it
          printf '#include "%s/rk3xsaradc_ioctl.h"\nint main(void){return sizeof(RK3X_SARADC_INFO)==4*54?0:1;}\n' "$PWD/$D" > hdr.c
          gcc -std=c11 -Wall -Wextra -Werror -o hdr hdr.c && ./hdr

  pin40-scripts:
    name: 40-pin PowerShell samples (Windows PowerShell 5.1)
    # The scripts in tools/pin40 load WinRT types (Windows.Devices.Gpio, .I2c,
    # .Spi, .Enumeration) the way they will on the board. The runner has no
    # RhProxy, so each script must get as far as asking for a controller and
    # stop there with its own message: a parse error or "Unable to find
    # type" fails the job.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse and load
        shell: powershell
        run: |
          $fail = $false
          foreach ($f in Get-ChildItem tools\pin40 -Filter *.ps1) {
            $tok = $null; $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tok, [ref]$err)
            if ($err) { $err | Out-Host; $fail = $true }
          }
          if ($fail) { throw 'parse errors' }
          $cases = @(
            @{ Script = 'tools\pin40\gpio-blink.ps1'; Args = @('-List') },
            @{ Script = 'tools\pin40\i2c-scan.ps1';   Args = @() }
          )
          # the scripts end with an error on purpose here; their stderr must
          # be read, not turned into a failure of this step
          $ErrorActionPreference = 'Continue'
          foreach ($c in $cases) {
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $c.Script @($c.Args) 2>&1 | Out-String
            Write-Host "== $($c.Script)"; Write-Host $out
            if ($out -match 'Unable to find type|ParserError|TypeNotFound') { throw "$($c.Script): WinRT types did not load" }
            if ($out -notmatch 'No GPIO controller|No I2C bus|I2C buses:') { throw "$($c.Script): did not reach the controller query" }
          }
          # both scripts exit 1 here by design (no RhProxy on the runner)
          $global:LASTEXITCODE = 0

  ec20-tools:
    name: EC20 usbnet mode scripts (shellcheck, Windows PowerShell 5.1)
    # tools/ec20 switches the TaishanPi 3M's EC20 between QMI and MBIM. No
    # modem on a runner: both scripts must get as far as looking for the AT
    # port and stop there with exit code 3.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse, ASCII, and run -Status without a modem
        shell: powershell
        run: |
          $f = (Resolve-Path tools\ec20\ec20-mode.ps1).Path
          $tok = $null; $err = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tok, [ref]$err)
          if ($err) { $err | Out-Host; throw 'ec20-mode.ps1 does not parse' }
          if ([System.IO.File]::ReadAllBytes($f) | Where-Object { $_ -ge 0x80 }) { throw 'ec20-mode.ps1 is not ASCII' }
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $f -Status 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 3) { throw "ec20-mode.ps1 -Status exited $code, expected 3 (no AT port)" }
          if ($out -notmatch 'No COM port on the EC20 AT interface') { throw 'did not reach the port lookup' }
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $f 2>&1 | Out-String
          if ($LASTEXITCODE -ne 3) { throw "ec20-mode.ps1 (switch) exited $LASTEXITCODE, expected 3" }
          # the step's own exit code would otherwise be the script's 3
          exit 0
  ec20-tools-linux:
    name: EC20 usbnet mode script (shellcheck, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck and run status without a modem
        run: |
          shellcheck -S warning tools/ec20/ec20-mode.sh
          set +e; tools/ec20/ec20-mode.sh status; code=$?; set -e
          [ "$code" -eq 3 ] || { echo "::error::ec20-mode.sh status exited $code, expected 3"; exit 1; }

  solution:
    name: WDK build (build/RockchipDrivers.sln)
    # The drivers imported from worproject/Rockchip-Windows-Drivers build as one
    # solution, the way their own CI does it. Built here as-is first, so every
    # RK3576 change after the import is measured against a baseline that
    # compiled.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build the solution (ARM64 Release)
        shell: pwsh
        run: |
          msbuild build\RockchipDrivers.sln `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:WoaDriverBuild=${{ github.run_number }} `
            /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for RockchipDrivers.sln" }

      - name: Upload driver packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rk3576-woa-solution-arm64
          path: build/ARM64/Release/Output/
          if-no-files-found: error

  wifi-package:
    name: Wi-Fi bring-up package, test-signed (dwcmshc + bcmwlsdio)
    # For a board session: dwcmshc with the SDIO controller support (W2)
    # and bcmwlsdio (W3), test-signed with a certificate made for this run,
    # with signer.cer, install-firmware.ps1 and the README, for pnputil on
    # an installed Windows (docs/dev/wifi.md). Not put on the WinPE media.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build, catalog and sign
        shell: pwsh
        run: |
          msbuild build\RockchipDrivers.sln /p:Configuration=Release /p:Platform=ARM64 `
                  /p:SignMode=Off /p:WoaDriverBuild=${{ github.run_number }} /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'msbuild failed for RockchipDrivers.sln' }
          msbuild drivers\net\bcmwlsdio\bcmwlsdio.vcxproj /p:Configuration=Release /p:Platform=ARM64 `
                  /p:WindowsTargetPlatformVersion=$env:WDK_VERSION /p:SignMode=Off /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'msbuild failed for bcmwlsdio' }

          $pkg = 'C:\wifi-pkg'
          foreach ($n in 'dwcmshc', 'bcmwlsdio') { New-Item -ItemType Directory -Force -Path "$pkg\$n" | Out-Null }
          Get-ChildItem build\ARM64\Release\Output\dwcmshc -Recurse -Include *.sys,*.inf |
            Copy-Item -Destination "$pkg\dwcmshc" -Force
          Get-ChildItem drivers\net\bcmwlsdio\ARM64\Release -Recurse -Include *.sys,*.inf |
            Copy-Item -Destination "$pkg\bcmwlsdio" -Force

          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $st   = Join-Path $kits "bin\$env:WDK_VERSION\x86\signtool.exe"
          $i2c  = Join-Path $kits "bin\$env:WDK_VERSION\x86\inf2cat.exe"
          $pw = 'rk3576-test'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=woa-rk3576 test signing' `
                    -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
          $pfx = 'C:\wifi-test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$pkg\signer.cer" | Out-Null
          foreach ($n in 'dwcmshc', 'bcmwlsdio') {
            $d = "$pkg\$n"
            & $i2c /driver:"$d" /os:10_RS3_ARM64 /verbose
            if ($LASTEXITCODE) { throw "inf2cat failed for ${n}: $LASTEXITCODE" }
            $files = Get-ChildItem $d -Include *.cat,*.sys -Recurse | Select-Object -ExpandProperty FullName
            & $st sign /fd sha256 /f $pfx /p $pw $files
            if ($LASTEXITCODE) { throw "signtool failed for ${n}: $LASTEXITCODE" }
            foreach ($sig in Get-AuthenticodeSignature $files) {
              Write-Host ("   {0,-14} {1}" -f $sig.Status, (Split-Path $sig.Path -Leaf))
              if ($sig.Status -eq 'NotSigned') { throw "$($sig.Path) came out unsigned" }
            }
            foreach ($f in "$n.inf", "$n.sys", "$n.cat") {
              if (-not (Test-Path (Join-Path $d $f))) { throw "$n package: $f missing" }
            }
          }
          Copy-Item drivers\net\bcmwlsdio\install-firmware.ps1, drivers\net\bcmwlsdio\README.md $pkg -Force
          "woa-rk3576 $env:GITHUB_SHA, run ${{ github.run_number }}" | Set-Content "$pkg\VERSION.txt" -Encoding ascii
          Get-ChildItem $pkg -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-bringup-signed-arm64
          path: C:\wifi-pkg\
          retention-days: 30
          if-no-files-found: error

  build:
    name: WDK build (${{ matrix.name }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: spi,  proj: drivers/spi/rk3xspi/rk3xspi.vcxproj }
          - { name: touch, proj: drivers/input/gt9271/gt9271.vcxproj }
          - { name: bluetooth, proj: drivers/bluetooth/bcm4345bt/bcm4345bt.vcxproj }
          - { name: uart, proj: drivers/serial/rk3xuart/rk3xuart.vcxproj }
          - { name: serialtest, proj: tools/serialtest/serialtest.vcxproj }
          - { name: vdpu383, proj: drivers/video/vdpu383/vdpu383.vcxproj }
          - { name: vdpu383test, proj: tools/vdpu383test/vdpu383test.vcxproj }
          - { name: saradc, proj: drivers/adc/rk3xsaradc/rk3xsaradc.vcxproj }
          - { name: adctest, proj: tools/adctest/adctest.vcxproj }
          - { name: pwrkey, proj: drivers/input/rk806pwrkey/rk806pwrkey.vcxproj }
          - { name: leds, proj: drivers/leds/rkled/rkled.vcxproj }
          - { name: eeprom, proj: drivers/misc/rkeeprom/rkeeprom.vcxproj }
          - { name: eepromtool, proj: tools/eeprom/eeprom.vcxproj }
          - { name: wdthang, proj: tools/wdthang/wdthang.vcxproj }
          - { name: wifi, proj: drivers/net/bcmwlsdio/bcmwlsdio.vcxproj }
          - { name: pageverify, proj: tools/pageverify/pageverify.vcxproj }
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Toolchain inventory
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $ver = '${{ env.WDK_VERSION }}'
          Write-Host "--- Include ---"
          Get-ChildItem "$kits\Include" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- Lib ---"
          Get-ChildItem "$kits\Lib" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- where the headers we depend on actually live ---"
          # The class extensions do not all ship in Include\<ver>\km: SpbCx and
          # NetAdapterCx live in versioned class-extension trees that the WDK
          # targets add only when the project opts in. Locate them, do not guess.
          foreach ($h in 'sdport.h','spbcx.h','gpioclx.h','netadaptercx.h','acpiioct.h','bthxddi.h','gpio.h','sercx.h','ntddsd.h') {
            Get-ChildItem $kits -Recurse -Filter $h -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("{0,-18} {1}" -f $h, $_.FullName) }
          }
          Write-Host "--- class-extension import libs (arm64) ---"
          foreach ($l in 'SpbCxStubs.lib','msgpioclxstub.lib','netadaptercxstub.lib','sdport.lib','sercx2.lib','sercx.lib','sdbus.lib') {
            Get-ChildItem $kits -Recurse -Filter $l -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'arm64' } |
              ForEach-Object { Write-Host ("{0,-22} {1}" -f $l, $_.FullName) }
          }
          Write-Host "--- SerCx libraries (arm64), whatever their name ---"
          Get-ChildItem "$kits\Lib" -Recurse -Filter '*sercx*' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'arm64' } |
            ForEach-Object { Write-Host $_.FullName }
          Write-Host "--- WDK VS build targets ---"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS: $vs"
          Get-ChildItem "$vs\MSBuild\Microsoft\VC\v170\Platforms\ARM64\PlatformToolsets" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- armasm64 ---"
          Get-ChildItem "$vs\VC\Tools\MSVC" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem "$($_.FullName)\bin\Hostx64\arm64\armasm64.exe" -ErrorAction SilentlyContinue } |
            Select-Object -ExpandProperty FullName
          Write-Host "--- inf2cat supported /os values ---"
          # The WDK default for a Universal Windows10 ARM64 driver is
          # Server10_arm64, i.e. build 14393 -- older than the 16299 our INFs
          # require for DIRID 13, so the DDInstall sections are excluded and the
          # signability test fails. Print what this inf2cat actually accepts.
          & "$kits\bin\$ver\x86\inf2cat.exe" /? 2>&1 | Select-String -Pattern 'ARM64|arm64'
          Write-Host "--- masm/marmasm build customizations ---"
          Get-ChildItem "$vs\MSBuild\Microsoft\VC\v170\BuildCustomizations" -Filter '*asm*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      - name: Resolve the WDK version
        id: wdk
        shell: pwsh
        run: |
          # A missing toolchain is a build failure, not something to skip past.
          # If the pin is absent, the runner image changed and WDK_VERSION
          # needs a deliberate bump - do not paper over it.
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $ver = '${{ env.WDK_VERSION }}'
          if ($ver -eq '') {
            $ver = (Get-ChildItem "$kits\Include" |
                    Where-Object { Test-Path (Join-Path $_.FullName 'km\sdport.h') } |
                    Sort-Object Name -Descending |
                    Select-Object -First 1).Name
            Write-Host "::warning::WDK_VERSION unpinned; auto-selected $ver"
          }
          if (-not $ver) { throw "no WDK with km headers found on this runner" }
          # Paths settled by the inventory step, not assumed: the class
          # extensions live in versioned subtrees and acpiioct.h is in shared,
          # not km.
          $need = @(
            "$kits\Include\$ver\km\wdm.h",
            "$kits\Include\$ver\km\sdport.h",
            "$kits\Include\$ver\km\gpioclx.h",
            "$kits\Include\$ver\shared\acpiioct.h",
            "$kits\Include\$ver\km\spb\1.1\spbcx.h",
            "$kits\Include\$ver\km\netcx\kmdf\adapter\2.1\netadaptercx.h",
            "$kits\Lib\$ver\km\arm64\ntoskrnl.lib",
            "$kits\Lib\$ver\km\arm64\sdport.lib",
            "$kits\Lib\$ver\km\arm64\msgpioclxstub.lib",
            "$kits\Lib\$ver\km\arm64\spb\1.1\spbcxstubs.lib",
            "$kits\Lib\$ver\km\arm64\netcx\kmdf\adapter\2.1\netadaptercxstub.lib"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::missing $_" }
            throw "WDK $ver is not fully present on this runner"
          }
          Write-Host "Using WDK $ver."
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.name }} (ARM64)
        shell: pwsh
        run: |
          msbuild ${{ matrix.proj }} `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:WindowsTargetPlatformVersion=${{ steps.wdk.outputs.version }} `
            /p:SignMode=Off `
            /m /nologo /v:normal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for ${{ matrix.name }}" }

      - name: Upload driver package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rk3576-woa-${{ matrix.name }}-arm64
          path: |
            **/ARM64/Release/**/*.sys
            **/ARM64/Release/**/*.inf
            **/ARM64/Release/**/*.cat
            **/ARM64/Release/**/*.pdb
            **/ARM64/Release/*.exe
          if-no-files-found: warn

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a runner-image refresh cannot silently change the headers the
  # drivers are validated against. Both the SDK and the WDK must be this
  # version; the km class extensions (sdport, SpbCx, GpioClx, NetAdapterCx)
  # come from the WDK half.
  WDK_VERSION: '10.0.26100.0'

jobs:
  checks:
    name: Structure & docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Driver package structure
        run: bash .github/scripts/check-structure.sh
      - name: Markdown relative links
        run: bash .github/scripts/check-links.sh

  hcd:
    name: bcm4345bt patchram walker (Linux, gcc)
    # The driver's .hcd walker is plain C. Build it with the host tool and
    # run it over both patchram files install-firmware.ps1 can fetch, at the
    # same pinned commits and hashes, so a change to the walker that would
    # reject (or mis-split) the real files fails here. The files are only
    # downloaded into the runner, never stored or uploaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: |
          set -eux
          B=drivers/bluetooth/bcm4345bt
          gcc -std=c99 -O2 -Wall -Wextra -Werror -o hcdcheck tools/hcdcheck/main.c $B/hcd.c
          gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -c $B/hcd.c -o /dev/null
          fetch() {
            curl -fsSL -o "$1" "$2"
            echo "$3  $1" | sha256sum -c -
          }
          fetch ampak.hcd \
            https://raw.githubusercontent.com/armbian/firmware/6b6f053f6089e08dd2a675cda1ec813de2e842e2/brcm/BCM4345C5.hcd \
            f67164f0eda8d4ca96305e177a61542bf8b470f2f1c456b66fe8c660650f1c7a
          fetch rpi.hcd \
            https://raw.githubusercontent.com/RPi-Distro/bluez-firmware/cdf61dc691a49ff01a124752bd04194907f0f9cd/debian/firmware/broadcom/BCM4345C5.hcd \
            fb9f4ec2df5301bd35f416384e103c012c5983024c49aa72fbbaf90177512caa
          ./hcdcheck ampak.hcd --records 198
          ./hcdcheck rpi.hcd --records 235
          # the hashes in install-firmware.ps1 must be the ones checked here
          grep -qi f67164f0eda8d4ca96305e177a61542bf8b470f2f1c456b66fe8c660650f1c7a $B/install-firmware.ps1
          grep -qi fb9f4ec2df5301bd35f416384e103c012c5983024c49aa72fbbaf90177512caa $B/install-firmware.ps1
          # a truncated file must be refused
          head -c 1000 ampak.hcd > trunc.hcd
          if ./hcdcheck trunc.hcd; then exit 1; fi

  pageverify:
    name: pageverify (Linux, gcc)
    # The page-integrity tool is portable C. The Linux build is the one used
    # on the PC to make pattern files that are then copied to the board, so
    # it is built and self-tested here, then run end to end: write, verify,
    # plant a foreign page and a misplaced page, verify again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: |
          set -eux
          gcc -std=c11 -O2 -Wall -Wextra -Werror -o pageverify tools/pageverify/pageverify.c
          ./pageverify selftest
          ./pageverify write t.bin 32 --seed 1234
          ./pageverify verify t.bin --passes 2
          head -c 4096 /dev/urandom | dd of=t.bin bs=4096 seek=100 conv=notrunc
          dd if=t.bin of=t.bin bs=4096 skip=3 seek=200 count=1 conv=notrunc
          set +e
          ./pageverify verify t.bin > out.txt
          rc=$?
          set -e
          cat out.txt
          test "$rc" -eq 1
          grep -q 'BAD page 100 at offset 0x64000' out.txt
          grep -q 'BAD page 200 at offset 0xc8000.*misplaced page of THIS file.*page 3 ' out.txt
          ./pageverify loop . 8 --rounds 2
      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: pageverify-linux-x64
          path: pageverify

  solution:
    name: WDK build (build/RockchipDrivers.sln)
    # The drivers imported from worproject/Rockchip-Windows-Drivers build as one
    # solution, the way their own CI does it. Built here as-is first, so every
    # RK3576 change after the import is measured against a baseline that
    # compiled.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build the solution (ARM64 Release)
        shell: pwsh
        run: |
          msbuild build\RockchipDrivers.sln `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:WoaDriverBuild=${{ github.run_number }} `
            /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for RockchipDrivers.sln" }

      - name: Upload driver packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rk3576-woa-solution-arm64
          path: build/ARM64/Release/Output/
          if-no-files-found: error

  build:
    name: WDK build (${{ matrix.name }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: spi,  proj: drivers/spi/rk3xspi/rk3xspi.vcxproj }
          - { name: touch, proj: drivers/input/gt9271/gt9271.vcxproj }
          - { name: bluetooth, proj: drivers/bluetooth/bcm4345bt/bcm4345bt.vcxproj }
          - { name: pageverify, proj: tools/pageverify/pageverify.vcxproj }
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Toolchain inventory
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $ver = '${{ env.WDK_VERSION }}'
          Write-Host "--- Include ---"
          Get-ChildItem "$kits\Include" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- Lib ---"
          Get-ChildItem "$kits\Lib" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- where the headers we depend on actually live ---"
          # The class extensions do not all ship in Include\<ver>\km: SpbCx and
          # NetAdapterCx live in versioned class-extension trees that the WDK
          # targets add only when the project opts in. Locate them, do not guess.
          foreach ($h in 'sdport.h','spbcx.h','gpioclx.h','netadaptercx.h','acpiioct.h','bthxddi.h','gpio.h') {
            Get-ChildItem $kits -Recurse -Filter $h -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("{0,-18} {1}" -f $h, $_.FullName) }
          }
          Write-Host "--- class-extension import libs (arm64) ---"
          foreach ($l in 'SpbCxStubs.lib','msgpioclxstub.lib','netadaptercxstub.lib','sdport.lib') {
            Get-ChildItem $kits -Recurse -Filter $l -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'arm64' } |
              ForEach-Object { Write-Host ("{0,-22} {1}" -f $l, $_.FullName) }
          }
          Write-Host "--- WDK VS build targets ---"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS: $vs"
          Get-ChildItem "$vs\MSBuild\Microsoft\VC\v170\Platforms\ARM64\PlatformToolsets" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- armasm64 ---"
          Get-ChildItem "$vs\VC\Tools\MSVC" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem "$($_.FullName)\bin\Hostx64\arm64\armasm64.exe" -ErrorAction SilentlyContinue } |
            Select-Object -ExpandProperty FullName
          Write-Host "--- inf2cat supported /os values ---"
          # The WDK default for a Universal Windows10 ARM64 driver is
          # Server10_arm64, i.e. build 14393 -- older than the 16299 our INFs
          # require for DIRID 13, so the DDInstall sections are excluded and the
          # signability test fails. Print what this inf2cat actually accepts.
          & "$kits\bin\$ver\x86\inf2cat.exe" /? 2>&1 | Select-String -Pattern 'ARM64|arm64'
          Write-Host "--- masm/marmasm build customizations ---"
          Get-ChildItem "$vs\MSBuild\Microsoft\VC\v170\BuildCustomizations" -Filter '*asm*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      - name: Resolve the WDK version
        id: wdk
        shell: pwsh
        run: |
          # A missing toolchain is a build failure, not something to skip past.
          # If the pin is absent, the runner image changed and WDK_VERSION
          # needs a deliberate bump - do not paper over it.
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $ver = '${{ env.WDK_VERSION }}'
          if ($ver -eq '') {
            $ver = (Get-ChildItem "$kits\Include" |
                    Where-Object { Test-Path (Join-Path $_.FullName 'km\sdport.h') } |
                    Sort-Object Name -Descending |
                    Select-Object -First 1).Name
            Write-Host "::warning::WDK_VERSION unpinned; auto-selected $ver"
          }
          if (-not $ver) { throw "no WDK with km headers found on this runner" }
          # Paths settled by the inventory step, not assumed: the class
          # extensions live in versioned subtrees and acpiioct.h is in shared,
          # not km.
          $need = @(
            "$kits\Include\$ver\km\wdm.h",
            "$kits\Include\$ver\km\sdport.h",
            "$kits\Include\$ver\km\gpioclx.h",
            "$kits\Include\$ver\shared\acpiioct.h",
            "$kits\Include\$ver\km\spb\1.1\spbcx.h",
            "$kits\Include\$ver\km\netcx\kmdf\adapter\2.1\netadaptercx.h",
            "$kits\Lib\$ver\km\arm64\ntoskrnl.lib",
            "$kits\Lib\$ver\km\arm64\sdport.lib",
            "$kits\Lib\$ver\km\arm64\msgpioclxstub.lib",
            "$kits\Lib\$ver\km\arm64\spb\1.1\spbcxstubs.lib",
            "$kits\Lib\$ver\km\arm64\netcx\kmdf\adapter\2.1\netadaptercxstub.lib"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::missing $_" }
            throw "WDK $ver is not fully present on this runner"
          }
          Write-Host "Using WDK $ver."
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.name }} (ARM64)
        shell: pwsh
        run: |
          msbuild ${{ matrix.proj }} `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:WindowsTargetPlatformVersion=${{ steps.wdk.outputs.version }} `
            /p:SignMode=Off `
            /m /nologo /v:normal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for ${{ matrix.name }}" }

      - name: Upload driver package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rk3576-woa-${{ matrix.name }}-arm64
          path: |
            **/ARM64/Release/**/*.sys
            **/ARM64/Release/**/*.inf
            **/ARM64/Release/**/*.cat
            **/ARM64/Release/**/*.pdb
            **/ARM64/Release/*.exe
          if-no-files-found: warn

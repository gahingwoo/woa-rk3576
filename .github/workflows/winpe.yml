name: WinPE (ARM64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/woa-debug/**'
      - '.github/workflows/winpe.yml'

permissions:
  contents: read

env:
  #
  # WinPE 22621 is the Windows 11 22H2 baseline, and it is the build measured
  # booting to a desktop on CM5-IO. Pin it. Do NOT move to the 24H2 ADK
  # (WinPE 26100): 24H2 needs ARMv8.1 atomics and RK3576 is a Cortex-A72/A53
  # part at ARMv8.0, so a 26100 image cannot boot on this board at all. The
  # assertion step below turns that into a loud failure rather than a wasted
  # flash.
  #
  # The runner image already ships ADK 10.1.26100 Deployment Tools, and
  # adksetup 22621 refuses to install downlevel beside it (exit 1001 after a
  # few seconds). So nothing is installed here: the WinPE add-on payload is
  # downloaded with /layout and extracted with an MSI administrative install,
  # which has no version opinion at all. Servicing is done with the runner's
  # own DISM -- a newer DISM may service an older image, but not the reverse.
  #
  ADK_BUILD: '22621'
  WINPE_URL: 'https://go.microsoft.com/fwlink/?linkid=2196224'
  PE_ROOT:   'C:\WinPE_arm64'

jobs:
  winpe:
    name: Build ARM64 WinPE
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Download the WinPE add-on payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\adk-dl | Out-Null
          Invoke-WebRequest -Uri $env:WINPE_URL -OutFile C:\adk-dl\adkwinpesetup.exe
          $p = Start-Process C:\adk-dl\adkwinpesetup.exe -Wait -PassThru `
                 -ArgumentList '/quiet','/norestart','/ceip','off','/layout','C:\pe-layout'
          if ($p.ExitCode -ne 0) { throw "layout download failed with $($p.ExitCode)" }
          Get-ChildItem C:\pe-layout -Recurse -Include *.msi,*.cab |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Extract the payload without installing it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\pe-extract | Out-Null
          foreach ($msi in Get-ChildItem C:\pe-layout -Recurse -Filter *.msi) {
            Write-Host "== $($msi.Name)"
            $p = Start-Process msiexec.exe -Wait -PassThru `
                   -ArgumentList '/a',"`"$($msi.FullName)`"",'/qn',"TARGETDIR=C:\pe-extract"
            if ($p.ExitCode -ne 0) { Write-Host "   (exit $($p.ExitCode), continuing)" }
          }
          Write-Host '--- what landed ---'
          Get-ChildItem C:\pe-extract -Recurse -Directory |
            Where-Object { $_.Name -in 'arm64','Media','WinPE_OCs','en-us' } |
            Select-Object -ExpandProperty FullName | Write-Host

      - name: Locate the ARM64 WinPE pieces
        id: find
        shell: pwsh
        run: |
          $wim = Get-ChildItem C:\pe-extract -Recurse -Filter winpe.wim |
                 Where-Object { $_.FullName -match '\\arm64\\' } | Select-Object -First 1
          if (-not $wim) { throw 'no arm64 winpe.wim in the extracted payload' }
          $arm64 = $wim.Directory.Parent.FullName        # ...\arm64
          $media = Join-Path $arm64 'Media'
          $ocs   = Join-Path $arm64 'WinPE_OCs'
          foreach ($d in $media, $ocs) { if (-not (Test-Path $d)) { throw "missing $d" } }
          Write-Host "wim   = $($wim.FullName)"
          Write-Host "media = $media"
          Write-Host "ocs   = $ocs"
          "wim=$($wim.FullName)"  | Out-File -Append $env:GITHUB_OUTPUT
          "media=$media"          | Out-File -Append $env:GITHUB_OUTPUT
          "ocs=$ocs"              | Out-File -Append $env:GITHUB_OUTPUT

      - name: Lay out the media tree
        shell: pwsh
        run: |
          # This is what copype.cmd does, minus its dependency on an installed
          # ADK of a matching version.
          if (Test-Path $env:PE_ROOT) { Remove-Item $env:PE_ROOT -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$env:PE_ROOT\media","$env:PE_ROOT\mount" | Out-Null
          Copy-Item "${{ steps.find.outputs.media }}\*" "$env:PE_ROOT\media" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$env:PE_ROOT\media\sources" | Out-Null
          Copy-Item "${{ steps.find.outputs.wim }}" "$env:PE_ROOT\media\sources\boot.wim" -Force
          Get-ChildItem "$env:PE_ROOT\media"

      - name: Assert the image is 10.0.${{ env.ADK_BUILD }} and ARM64
        shell: pwsh
        run: |
          $info = & dism.exe /English /Get-WimInfo /WimFile:"$env:PE_ROOT\media\sources\boot.wim" /Index:1
          $info | Write-Host
          $text = $info -join "`n"
          $ver  = ([regex]'Version\s*:\s*([\d\.]+)').Match($text).Groups[1].Value
          $arch = ([regex]'Architecture\s*:\s*(\S+)').Match($text).Groups[1].Value
          if ($ver -notmatch "^10\.0\.$env:ADK_BUILD\.") {
            throw "WinPE build is '$ver', expected 10.0.$env:ADK_BUILD.* - refusing to ship an image that cannot boot on ARMv8.0"
          }
          if ($arch -ne 'ARM64') { throw "Architecture is '$arch', expected ARM64" }
          Write-Host "OK: WinPE $ver $arch"

      - name: Mount, add components, inject the collector, commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & dism.exe /Mount-Image /ImageFile:"$env:PE_ROOT\media\sources\boot.wim" /Index:1 /MountDir:"$env:PE_ROOT\mount"
          if ($LASTEXITCODE) { throw "mount failed: $LASTEXITCODE" }

          # Dependency order: WMI, then Scripting, then StorageWMI.
          # No third-party drivers go in on purpose -- the point of this image
          # is to see what Microsoft's own inbox stack makes of this board.
          # sdport/sdhc/sdstor and stornvme are inbox and already present.
          $ocs = '${{ steps.find.outputs.ocs }}'
          foreach ($p in 'WinPE-WMI','WinPE-Scripting','WinPE-StorageWMI',
                         'WinPE-FMAPI','WinPE-EnhancedStorage',
                         'WinPE-SecureStartup','WinPE-PlatformId') {
            Write-Host "== $p"
            & dism.exe /Image:"$env:PE_ROOT\mount" /Add-Package /PackagePath:"$ocs\$p.cab"
            if ($LASTEXITCODE) { throw "$p failed: $LASTEXITCODE" }
            $lang = "$ocs\en-us\${p}_en-us.cab"
            if (Test-Path $lang) {
              & dism.exe /Image:"$env:PE_ROOT\mount" /Add-Package /PackagePath:"$lang"
              if ($LASTEXITCODE) { throw "${p}_en-us failed: $LASTEXITCODE" }
            }
          }

          Copy-Item tools\woa-debug\startnet.cmd `
                    "$env:PE_ROOT\mount\Windows\System32\startnet.cmd" -Force
          New-Item -ItemType Directory -Force -Path "$env:PE_ROOT\media\woa-debug" | Out-Null
          Copy-Item tools\woa-debug\collect.cmd "$env:PE_ROOT\media\woa-debug\" -Force

          & dism.exe /Unmount-Image /MountDir:"$env:PE_ROOT\mount" /Commit
          if ($LASTEXITCODE) { throw "unmount failed: $LASTEXITCODE" }

      - name: Show what came out
        shell: pwsh
        run: |
          Get-ChildItem "$env:PE_ROOT\media" -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { "{0} files, {1:N0} MB" -f $_.Count, ($_.Sum/1MB) } | Write-Host
          Get-ChildItem "$env:PE_ROOT\media"
          if (-not (Test-Path "$env:PE_ROOT\media\EFI\Boot\bootaa64.efi")) {
            throw 'EFI\Boot\bootaa64.efi is missing - the board would not boot this'
          }

      - name: Upload the FAT32 media tree
        uses: actions/upload-artifact@v4
        with:
          # Extract this onto a FAT32 stick; the board's UEFI boots
          # EFI\Boot\bootaa64.efi from it directly.
          name: winpe-arm64-${{ env.ADK_BUILD }}
          path: C:\WinPE_arm64\media\**
          retention-days: 14
          if-no-files-found: error

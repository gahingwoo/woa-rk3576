name: WinPE (ARM64)

on:
  workflow_dispatch:
    inputs:
      drivers:
        description: 'Inject the RK3576 ARM64 drivers (needs test signing, enabled with them)'
        type: boolean
        default: true
  push:
    paths:
      - 'tools/woa-debug/**'
      - '.github/workflows/winpe.yml'

permissions:
  contents: read

env:
  #
  # WinPE 22621 is the Windows 11 22H2 baseline, and it is the build measured
  # booting to a desktop on CM5-IO. Pin it. Do NOT move to the 24H2 ADK
  # (WinPE 26100): 24H2 needs ARMv8.1 atomics and RK3576 is a Cortex-A72/A53
  # part at ARMv8.0, so a 26100 image cannot boot on this board at all. The
  # assertion step below turns that into a loud failure rather than a wasted
  # flash.
  #
  # The runner image already ships ADK 10.1.26100 Deployment Tools, and
  # adksetup 22621 refuses to install downlevel beside it (exit 1001 after a
  # few seconds). So nothing is installed here: the WinPE add-on payload is
  # downloaded with /layout and extracted with an MSI administrative install,
  # which has no version opinion at all. Servicing is done with the runner's
  # own DISM -- a newer DISM may service an older image, but not the reverse.
  #
  ADK_BUILD: '22621'
  WINPE_URL: 'https://go.microsoft.com/fwlink/?linkid=2196224'
  PE_ROOT:   'C:\WinPE_arm64'
  # Same pin as ci.yml: the class extensions come from the WDK half.
  WDK_VERSION:  '10.0.26100.0'
  DRIVER_STAGE: 'C:\rk-drivers'

jobs:
  winpe:
    name: Build ARM64 WinPE
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drivers }}
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build the ARM64 drivers to inject
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drivers }}
        shell: pwsh
        run: |
          # Built here rather than pulled from the CI workflow's artifacts:
          # cross-workflow download needs a run id and a token, and this keeps
          # the image and the drivers in it from drifting apart.
          #
          # rkdwmmc needs rk3576gpio, because Sdhc.asl routes card detect
          # through GpioInt on \_SB.GPI0 rather than the controller's CDETECT.
          $projects = @(
            'drivers/storage/rkdwmmc/rkdwmmc.vcxproj',
            'drivers/gpio/rk3576gpio/rk3576gpio.vcxproj'
          )
          New-Item -ItemType Directory -Force -Path $env:DRIVER_STAGE | Out-Null
          foreach ($proj in $projects) {
            Write-Host "== $proj"
            msbuild $proj /p:Configuration=Release /p:Platform=ARM64 `
                    /p:WindowsTargetPlatformVersion=$env:WDK_VERSION `
                    /p:SignMode=Off /m /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for $proj" }
          }
          # dism /Add-Driver wants each INF beside its .sys, so flatten per
          # driver rather than handing it the build tree.
          foreach ($d in Get-ChildItem 'drivers' -Recurse -Directory |
                         Where-Object { $_.FullName -match '\\ARM64\\Release$' }) {
            $name = Split-Path (Split-Path (Split-Path $d.FullName -Parent) -Parent) -Leaf
            $out  = Join-Path $env:DRIVER_STAGE $name
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Get-ChildItem $d.FullName -Recurse -Include *.sys,*.inf,*.cat |
              Copy-Item -Destination $out -Force
          }
          if (-not (Get-ChildItem $env:DRIVER_STAGE -Recurse -Filter *.sys)) {
            throw 'no .sys came out of the driver build'
          }

          # Test-sign them.
          #
          # testsigning on the target does NOT mean "load unsigned drivers" --
          # it means "accept a signature that does not chain to a trusted
          # root". A driver with no signature at all is still refused, and the
          # first attempt at this shipped SignMode=Off binaries and got exactly
          # that on hardware:
          #
          #   ACPI\RKCP3002\0  Rockchip RK3576 GPIO Controller
          #   Problem 52 (0x34) CM_PROB_UNSIGNED_DRIVER
          #   Problem Status 0xC0000428  (STATUS_INVALID_IMAGE_HASH)
          #
          # which then held up the SD controller behind it with
          # CM_PROB_WAITING_ON_DEPENDENCY, because card detect is a GpioInt.
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $st   = Join-Path $kits "bin\$env:WDK_VERSION\x86\signtool.exe"
          $i2c  = Join-Path $kits "bin\$env:WDK_VERSION\x86\inf2cat.exe"
          foreach ($t in $st, $i2c) { if (-not (Test-Path $t)) { throw "missing $t" } }

          $pfxPw = 'rk3576-test'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                    -Subject 'CN=woa-rk3576 test signing' `
                    -CertStoreLocation Cert:\CurrentUser\My `
                    -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
          $pfx = 'C:\rk-test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString $pfxPw -Force -AsPlainText) | Out-Null

          foreach ($d in Get-ChildItem $env:DRIVER_STAGE -Directory) {
            Write-Host "== catalog + signature: $($d.Name)"
            # 10_RS3_ARM64 is build 16299. The other value this inf2cat takes,
            # Server10_ARM64, is 14393 -- older than the 16299 these INFs need
            # for DIRID 13, so it drops the DDInstall sections and the
            # signability test fails.
            & $i2c /driver:"$($d.FullName)" /os:10_RS3_ARM64 /verbose
            if ($LASTEXITCODE) { throw "inf2cat failed for $($d.Name): $LASTEXITCODE" }
            $files = Get-ChildItem $d.FullName -Include *.cat,*.sys -Recurse |
                     Select-Object -ExpandProperty FullName
            & $st sign /fd sha256 /f $pfx /p $pfxPw $files
            if ($LASTEXITCODE) { throw "signtool failed for $($d.Name): $LASTEXITCODE" }
            & $st verify /pa /v $files 2>&1 | Select-String -Pattern 'Successfully|Issued to' |
              ForEach-Object { Write-Host "   $_" }
          }

          Get-ChildItem $env:DRIVER_STAGE -Recurse -File |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Download the WinPE add-on payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\adk-dl | Out-Null
          Invoke-WebRequest -Uri $env:WINPE_URL -OutFile C:\adk-dl\adkwinpesetup.exe
          $p = Start-Process C:\adk-dl\adkwinpesetup.exe -Wait -PassThru `
                 -ArgumentList '/quiet','/norestart','/ceip','off','/layout','C:\pe-layout'
          if ($p.ExitCode -ne 0) { throw "layout download failed with $($p.ExitCode)" }
          Get-ChildItem C:\pe-layout -Recurse -Include *.msi,*.cab |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Extract the payload without installing it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\pe-extract | Out-Null
          foreach ($msi in Get-ChildItem C:\pe-layout -Recurse -Filter *.msi) {
            Write-Host "== $($msi.Name)"
            $p = Start-Process msiexec.exe -Wait -PassThru `
                   -ArgumentList '/a',"`"$($msi.FullName)`"",'/qn',"TARGETDIR=C:\pe-extract"
            if ($p.ExitCode -ne 0) { Write-Host "   (exit $($p.ExitCode), continuing)" }
          }
          Write-Host '--- what landed ---'
          Get-ChildItem C:\pe-extract -Recurse -Directory |
            Where-Object { $_.Name -in 'arm64','Media','WinPE_OCs','en-us' } |
            Select-Object -ExpandProperty FullName | Write-Host

      - name: Locate the ARM64 WinPE pieces
        id: find
        shell: pwsh
        run: |
          $wim = Get-ChildItem C:\pe-extract -Recurse -Filter winpe.wim |
                 Where-Object { $_.FullName -match '\\arm64\\' } | Select-Object -First 1
          if (-not $wim) { throw 'no arm64 winpe.wim in the extracted payload' }
          $arm64 = $wim.Directory.Parent.FullName        # ...\arm64
          $media = Join-Path $arm64 'Media'
          $ocs   = Join-Path $arm64 'WinPE_OCs'
          foreach ($d in $media, $ocs) { if (-not (Test-Path $d)) { throw "missing $d" } }
          Write-Host "wim   = $($wim.FullName)"
          Write-Host "media = $media"
          Write-Host "ocs   = $ocs"
          "wim=$($wim.FullName)"  | Out-File -Append $env:GITHUB_OUTPUT
          "media=$media"          | Out-File -Append $env:GITHUB_OUTPUT
          "ocs=$ocs"              | Out-File -Append $env:GITHUB_OUTPUT

      - name: Lay out the media tree
        shell: pwsh
        run: |
          # This is what copype.cmd does, minus its dependency on an installed
          # ADK of a matching version.
          if (Test-Path $env:PE_ROOT) { Remove-Item $env:PE_ROOT -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$env:PE_ROOT\media","$env:PE_ROOT\mount" | Out-Null
          Copy-Item "${{ steps.find.outputs.media }}\*" "$env:PE_ROOT\media" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$env:PE_ROOT\media\sources" | Out-Null
          Copy-Item "${{ steps.find.outputs.wim }}" "$env:PE_ROOT\media\sources\boot.wim" -Force
          Get-ChildItem "$env:PE_ROOT\media"

      - name: Pick a DISM new enough to service the image
        id: dism
        shell: pwsh
        run: |
          # The in-box dism.exe on windows-2022 is 10.0.20348, older than the
          # 22621 image we are about to service, and DISM only services
          # downlevel. The runner's ADK 26100 DISM is the right way round.
          $cand = @(
            'C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\DISM\dism.exe'
          ) + (Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter dism.exe `
                 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $best = $null; $bestVer = [version]'0.0'
          foreach ($c in ($cand | Select-Object -Unique)) {
            if (-not (Test-Path $c)) { continue }
            $v = [version](Get-Item $c).VersionInfo.ProductVersion.Split('-')[0]
            Write-Host ("{0}  {1}" -f $v, $c)
            if ($v -gt $bestVer) { $bestVer = $v; $best = $c }
          }
          if (-not $best) { throw 'no ADK dism.exe on the runner' }
          if ($bestVer -lt [version]"10.0.$env:ADK_BUILD.0") {
            throw "best DISM is $bestVer, older than the $env:ADK_BUILD image it must service"
          }
          Write-Host "using $best ($bestVer)"
          "exe=$best" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Assert the image is 10.0.${{ env.ADK_BUILD }} and ARM64
        shell: pwsh
        run: |
          $info = & '${{ steps.dism.outputs.exe }}' /English /Get-WimInfo /WimFile:"$env:PE_ROOT\media\sources\boot.wim" /Index:1
          $info | Write-Host
          # DISM prints its own version in the banner as 'Version: x'; the
          # image's own line is 'Version : x', with a space before the colon,
          # and it comes after 'Index :'. Match on both so the tool's version
          # can never be mistaken for the image's -- it was, once, and the
          # build failed on a perfectly good image.
          $text = ($info -join "`n")
          $i    = $text.IndexOf('Index :')
          if ($i -ge 0) { $text = $text.Substring($i) }
          $ver  = ([regex]'(?m)^Version\s+:\s*([\d\.]+)').Match($text).Groups[1].Value
          $arch = ([regex]'(?m)^Architecture\s+:\s*(\S+)').Match($text).Groups[1].Value
          if ($ver -notmatch "^10\.0\.$env:ADK_BUILD") {
            throw "WinPE build is '$ver', expected 10.0.$env:ADK_BUILD* - refusing to ship an image that cannot boot on ARMv8.0"
          }
          if ($arch -ne 'arm64') { throw "Architecture is '$arch', expected arm64" }
          Write-Host "OK: WinPE $ver $arch"

      - name: Mount, add components, inject the collector, commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '${{ steps.dism.outputs.exe }}' /Mount-Image /ImageFile:"$env:PE_ROOT\media\sources\boot.wim" /Index:1 /MountDir:"$env:PE_ROOT\mount"
          if ($LASTEXITCODE) { throw "mount failed: $LASTEXITCODE" }

          # Dependency order: WMI, then Scripting, then StorageWMI.
          # sdport/sdhc/sdstor and stornvme are inbox and already present; the
          # RK3576 drivers go in below, on top of them.
          $ocs = '${{ steps.find.outputs.ocs }}'
          foreach ($p in 'WinPE-WMI','WinPE-Scripting','WinPE-StorageWMI',
                         'WinPE-FMAPI','WinPE-EnhancedStorage',
                         'WinPE-SecureStartup','WinPE-PlatformId') {
            Write-Host "== $p"
            & '${{ steps.dism.outputs.exe }}' /Image:"$env:PE_ROOT\mount" /Add-Package /PackagePath:"$ocs\$p.cab"
            if ($LASTEXITCODE) { throw "$p failed: $LASTEXITCODE" }
            $lang = "$ocs\en-us\${p}_en-us.cab"
            if (Test-Path $lang) {
              & '${{ steps.dism.outputs.exe }}' /Image:"$env:PE_ROOT\mount" /Add-Package /PackagePath:"$lang"
              if ($LASTEXITCODE) { throw "${p}_en-us failed: $LASTEXITCODE" }
            }
          }

          # The RK3576 drivers, if they were built.  They carry a test
          # signature; /ForceUnsigned is kept because the certificate does not
          # chain to a trusted root, which is what DISM objects to. Loading
          # them at boot additionally needs testsigning on the media's BCD --
          # the next step.
          if (Test-Path $env:DRIVER_STAGE) {
            & '${{ steps.dism.outputs.exe }}' /Image:"$env:PE_ROOT\mount" `
              /Add-Driver /Driver:"$env:DRIVER_STAGE" /Recurse /ForceUnsigned
            if ($LASTEXITCODE) { throw "Add-Driver failed: $LASTEXITCODE" }
          } else {
            Write-Host 'no drivers staged; building a stock image'
          }

          Copy-Item tools\woa-debug\startnet.cmd `
                    "$env:PE_ROOT\mount\Windows\System32\startnet.cmd" -Force
          New-Item -ItemType Directory -Force -Path "$env:PE_ROOT\media\woa-debug" | Out-Null
          Copy-Item tools\woa-debug\collect.cmd "$env:PE_ROOT\media\woa-debug\" -Force

          & '${{ steps.dism.outputs.exe }}' /Unmount-Image /MountDir:"$env:PE_ROOT\mount" /Commit
          if ($LASTEXITCODE) { throw "unmount failed: $LASTEXITCODE" }

      - name: Let the media load unsigned drivers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drivers }}
        shell: pwsh
        run: |
          # Staging an unsigned driver is not the same as being allowed to load
          # it.  Both switches live on the media's own BCD, so they apply to
          # this stick and nothing else -- no change to the board, and nothing
          # to undo afterwards.
          $bcd = "$env:PE_ROOT\media\EFI\Microsoft\Boot\BCD"
          if (-not (Test-Path $bcd)) { throw "no BCD at $bcd" }
          foreach ($opt in 'testsigning on', 'nointegritychecks on') {
            $args = @('/store', $bcd, '/set', '{default}') + $opt.Split(' ')
            & bcdedit.exe @args
            if ($LASTEXITCODE) { throw "bcdedit $opt failed: $LASTEXITCODE" }
          }
          & bcdedit.exe /store $bcd /enum '{default}' | Write-Host

      - name: Show what came out
        shell: pwsh
        run: |
          Get-ChildItem "$env:PE_ROOT\media" -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { "{0} files, {1:N0} MB" -f $_.Count, ($_.Sum/1MB) } | Write-Host
          Get-ChildItem "$env:PE_ROOT\media"
          if (-not (Test-Path "$env:PE_ROOT\media\EFI\Boot\bootaa64.efi")) {
            throw 'EFI\Boot\bootaa64.efi is missing - the board would not boot this'
          }

      - name: Upload the FAT32 media tree
        uses: actions/upload-artifact@v4
        with:
          # Extract this onto a FAT32 stick; the board's UEFI boots
          # EFI\Boot\bootaa64.efi from it directly.
          name: winpe-arm64-${{ env.ADK_BUILD }}
          path: C:\WinPE_arm64\media\**
          retention-days: 14
          if-no-files-found: error

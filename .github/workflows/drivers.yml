name: Driver package

# The RK3576 Windows driver package: one zip, rk3576-drivers-arm64.zip, with
# every Windows driver for the three boards, one version, one install.cmd and
# a manifest saying which board gets which driver (tools/rk3576-drivers).
# Maskrom Studio installs the board's list from it.
#
#   woa-rk3576        built here from this commit by build-woa.ps1 (every
#                     "woa" line of drivers.tsv: the storage, bus, audio,
#                     input and null drivers), test-signed with a
#                     certificate made for this run
#   wddm-mali-g52     wddm-mali-g52-driver-arm64 of its latest successful CI
#                     run of main (maliwddm with its UMD, malivop)
#   woa-rk3576-npu    rknpu-windows-arm64 of its latest successful CI run of
#                     main (rknpu)
# The run ids, commits and the SHA-256 of each input go into manifest.json.
#
# Downloading another repository's artifacts needs a token that may read its
# Actions; DRIVER_SOURCES_TOKEN (a fine-grained token with Actions: read on
# the two repositories) is used when it is set, the workflow's own token
# otherwise.
#
# On main the zip goes onto the rolling "ci" pre-release with its line in
# SHA256SUMS.txt (ci-release.sh keeps the other workflows' assets).

on:
  push:
    branches: [main]
    paths:
      - 'drivers/**'
      - 'build/**'
      - 'tools/rk3576-drivers/**'
      - '.github/workflows/drivers.yml'
  pull_request:
    paths:
      - 'drivers/**'
      - 'build/**'
      - 'tools/rk3576-drivers/**'
      - '.github/workflows/drivers.yml'
  # The GPU and NPU drivers live in other repositories: pick up their new
  # builds once a day.
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Same pin as ci.yml and winpe.yml.
  WDK_VERSION: '10.0.26100.0'

jobs:
  woa:
    name: Build and sign the woa-rk3576 drivers (ARM64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build, catalog, sign
        shell: pwsh
        run: |
          # The run number goes into DriverVer: a later package outranks
          # an earlier one at the reinstall install.cmd /online asks for.
          ./tools/rk3576-drivers/build-woa.ps1 -Table tools/rk3576-drivers/drivers.tsv `
            -Out "$env:RUNNER_TEMP\woa" -Build ${{ github.run_number }} -Wdk $env:WDK_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: woa-rk3576-drivers-signed
          path: ${{ runner.temp }}/woa/
          retention-days: 7
          if-no-files-found: error

  package:
    name: rk3576-drivers-arm64.zip
    needs: woa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test assemble.py
        run: python3 -I tools/rk3576-drivers/test_assemble.py

      - name: Find the builds to take the drivers from
        id: runs
        env:
          GH_TOKEN: ${{ secrets.DRIVER_SOURCES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          latest() {  # repo workflow-file
            gh run list -R "$1" -w "$2" -b main -s success -L 1 --json databaseId,headSha \
              -q '.[0] | "\(.databaseId) \(.headSha)"'
          }
          read -r gpu_run gpu_sha < <(latest gahingwoo/wddm-mali-g52 ci.yml)
          read -r npu_run npu_sha < <(latest gahingwoo/woa-rk3576-npu ci.yml)
          for v in gpu_run npu_run; do
            [ -n "${!v}" ] || { echo "::error::no successful run for $v"; exit 1; }
          done
          {
            echo "gpu_run=$gpu_run"; echo "gpu_sha=$gpu_sha"
            echo "npu_run=$npu_run"; echo "npu_sha=$npu_sha"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: woa-rk3576-drivers-signed
          path: in/woa

      - name: Download them
        env:
          GH_TOKEN: ${{ secrets.DRIVER_SOURCES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh run download ${{ steps.runs.outputs.gpu_run }} -R gahingwoo/wddm-mali-g52 -n wddm-mali-g52-driver-arm64 -D in/gpu
          gh run download ${{ steps.runs.outputs.npu_run }} -R gahingwoo/woa-rk3576-npu -n rknpu-windows-arm64 -D in/npu
          (cd in/npu && sha256sum -c rknpu-windows-arm64.zip.sha256)
          find in -maxdepth 3 | sort

      - name: Assemble
        env:
          GPU_RUN: ${{ steps.runs.outputs.gpu_run }}
          GPU_SHA: ${{ steps.runs.outputs.gpu_sha }}
          NPU_RUN: ${{ steps.runs.outputs.npu_run }}
          NPU_SHA: ${{ steps.runs.outputs.npu_sha }}
        run: |
          set -euo pipefail
          # ci-<this commit>; a release attaches the package under its own version.
          version="ci-${GITHUB_SHA::7}"
          gpuin=$(find in/gpu -name driver -type d -printf '%h\n' | head -1)
          python3 -I tools/rk3576-drivers/assemble.py \
            --table tools/rk3576-drivers/drivers.tsv \
            --install tools/rk3576-drivers/install.cmd \
            --script tools/rk3576-drivers/install-online.ps1 \
            --script tools/rk3576-drivers/mark-reinstall.ps1 \
            --readme tools/rk3576-drivers/README.md \
            --readme tools/rk3576-drivers/README.zh-CN.md \
            --woa in/woa --gpu "$gpuin" --npu in/npu/rknpu-windows-arm64.zip \
            --version "$version" \
            --source "package=$GITHUB_REPOSITORY@$GITHUB_SHA run $GITHUB_RUN_ID" \
            --source "woa-rk3576=$GITHUB_REPOSITORY@$GITHUB_SHA built in run $GITHUB_RUN_ID" \
            --source "wddm-mali-g52=gahingwoo/wddm-mali-g52@$GPU_SHA CI run $GPU_RUN" \
            --source "woa-rk3576-npu=gahingwoo/woa-rk3576-npu@$NPU_SHA CI run $NPU_RUN, rknpu-windows-arm64.zip $(cut -d' ' -f1 in/npu/rknpu-windows-arm64.zip.sha256)" \
            --out out
          unzip -l out/rk3576-drivers-arm64.zip
          sha256sum out/rk3576-drivers-arm64.zip

      - name: Check the package
        run: |
          set -euo pipefail
          mkdir chk && cd chk
          unzip -q ../out/rk3576-drivers-arm64.zip
          cd rk3576-drivers
          sha256sum -c --quiet SHA256SUMS.txt
          python3 -I - <<'PY'
          import json, os
          m = json.load(open('manifest.json'))
          for b in m['boards']:
              want = [d['dir'] for d in m['drivers'] if b in d['default']]
              got = [l.strip() for l in open(f'boards/{b}.txt') if l.strip()]
              assert want == got, (b, want, got)
              for d in want:
                  assert os.listdir(f'drivers/{d}'), d
              # every board boots from its storage with these, and has
              # audio and the no-driver devices
              for core in ('dwcsdhc', 'dwcmshc', 'maliwddm', 'vdpu383', 'rk3xi2sbus',
                           'csaudiork3x', 'es8323', 'rk3576-null'):
                  assert core in want, (b, core)
          print('manifest and board lists agree')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rk3576-drivers-arm64
          path: out/rk3576-drivers-arm64.zip
          if-no-files-found: error

  online-plan:
    name: install.cmd /online, planned on a Windows runner
    # install-online.ps1 -Plan on the real package: parses every INF the
    # board would stage, matches the runner's devices, changes nothing.
    # The INF parser has to find the IDs the board run depends on.
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rk3576-drivers-arm64
          path: pkg
      - name: Parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          Expand-Archive pkg\rk3576-drivers-arm64.zip -DestinationPath pkg
          foreach ($f in 'install-online.ps1', 'mark-reinstall.ps1') {
            $tok = $null; $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "pkg\rk3576-drivers\$f"), [ref]$tok, [ref]$err)
            if ($err) { $err | Out-Host; throw "$f does not parse" }
          }
      - name: Plan each board (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $want = @{
            'rk3xi2sbus'  = 'ACPI\RKCP3004'
            'es8323'      = 'ACPI\RKCP8388'
            'csaudiork3x' = 'CSAUDIO\RK&CLTR'
            'rk3576-null' = 'ACPI\AMZN0001'
            'dwcmshc'     = 'ACPI\RKCPFE2C'
          }
          foreach ($b in 'tspi3m', 'cm5io', 'rock4d') {
            $o = & powershell -NoProfile -ExecutionPolicy Bypass -File pkg\rk3576-drivers\install-online.ps1 -Board $b -Plan
            $rc = $LASTEXITCODE
            $o | Out-Host
            if ($rc -ne 0) { throw "$b plan: exit $rc" }
            foreach ($k in $want.Keys) {
              $line = $o | Where-Object { $_ -like "${k}: would stage *" } | Select-Object -First 1
              if (-not $line) { throw "${b}: no plan line for $k" }
              if ($line -notlike "*$($want[$k])*") { throw "${b}: $k does not name $($want[$k]): $line" }
              if ($line -like '*no DriverVer*') { throw "${b}: $k has no DriverVer: $line" }
            }
          }
          $o = & powershell -NoProfile -ExecutionPolicy Bypass -File pkg\rk3576-drivers\install-online.ps1 -Board nosuch -Plan
          if ($LASTEXITCODE -ne 2) { throw "an unknown board should exit 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

  release:
    name: Rolling "ci" release (driver package)
    needs: [package, online-plan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: woa-ci-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: rk3576-drivers-arm64
          path: rel
      - name: Update the ci release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-release.sh '^rk3576-drivers-arm64.*\.zip$' rel/rk3576-drivers-arm64.zip
